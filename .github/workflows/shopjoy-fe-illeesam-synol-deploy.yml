# shopjoy-fe-illeesam-synol-deploy.yml — 2026-09-02 신설.
#
# GitHub Actions로 빌드한 dist/ 를 Synology NAS 로 배포한다 — docker-compose.yml 의 nginx
# 서비스가 /volume1/docker/shopjoy/frontend 를 읽기전용으로 마운트해서 그대로 서빙한다
# (ec_v26/shopjoy_v260406/_apps_be/EcAdminApi/docker-compose.yml 의 nginx.volumes 참조). 컨테이너
# 재시작 불필요 — nginx 는 파일시스템을 직접 읽으므로 새 파일을 올려두면 다음 요청부터
# (app JS/CSS/HTML 은 no-cache 캐시정책이라) 바로 반영된다.
#
# main에 push 되면 트리거는 되지만, 실제 빌드+배포는 커밋 메시지에 정확히
# 'deploy_dev-github-fe-vue3cdn' 또는 'deploy_dev-github-full' 토큰이 들어있을 때만 진행한다
# (npm run deploy:dev-github-fe-vue3cdn 이 이 토큰을 커밋 메시지에 실어 보낸다. 2026-09-06
# 변경 — 예전엔 'deploy'/'배포' 아무 단어나 매칭되는 느슨한 방식이었다). 토큰이 없으면 스킵.
# (workflow_dispatch로 수동 실행할 땐 이 토큰 체크 없이 무조건 진행됨)
#
# 같은 dist/ 를 GitHub Pages 에도 배포하려면 shopjoy-fe-illeesam-github-deploy.yml 참조 —
# 두 배포는 서로 독립적이라 하나가 실패해도 다른 쪽엔 영향 없다.
#
# 필요 시크릿(리포지토리 Settings → Secrets and variables → Actions, deploy-ec-admin.yml과
# 공유): SYNOLOGY_HOST / SYNOLOGY_PORT / SYNOLOGY_USER / SYNOLOGY_PASSWORD / SYNOLOGY_SSH_KEY
#
# ⚠ NAS 쪽 /volume1/docker/shopjoy/frontend 디렉터리는 nginx 컨테이너가 미리 마운트하고
#   있어야 한다 — docker-compose 스택이 아직 안 떠있으면(shopjoy-be-illeesam-synol-deploy.yml
#   최초 1회 실행 전) 이 워크플로가 파일은 올려도 실제로 서빙되진 않는다.

name: shopjoy-fe-illeesam-synol-deploy

on:
  push:
    branches: [main]
    paths:
      - 'ec_v26/shopjoy_v260406/pages/**'
      - 'ec_v26/shopjoy_v260406/lib/**'
      - 'ec_v26/shopjoy_v260406/components/**'
      - 'ec_v26/shopjoy_v260406/assets/**'
      - 'ec_v26/shopjoy_v260406/scripts/**'
      - 'ec_v26/shopjoy_v260406/*.html'
      - 'ec_v26/shopjoy_v260406/package.json'
  workflow_dispatch: {}

defaults:
  run:
    working-directory: ec_v26/shopjoy_v260406

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 커밋 메시지에 이 워크플로 전용 토큰(deploy_dev-github-fe-vue3cdn) 또는 전체트리거 토큰
    # (deploy_dev-github-full) 이 있어야 진행. workflow_dispatch(수동 실행)는 head_commit 이
    # 없으므로 항상 통과.
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'deploy_dev-github-fe-vue3cdn') ||
      contains(github.event.head_commit.message, 'deploy_dev-github-full')
    steps:
      - name: "[1] 소스코드 체크아웃"
        uses: actions/checkout@v4

      - name: "[2] Node 설정"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ec_v26/shopjoy_v260406/package-lock.json

      - name: "[3] 의존성 설치"
        run: npm ci

      - name: "[4] minify 빌드(dev 프로파일) + dist 정합성 검증 (실패 시 배포 중단)"
        # dev 프로파일 = lib/env/profiles/env{Bo,Fo}Consts.dev.js 로 apiOrigin='' 상대경로 적용.
        # 이 NAS 배포는 nginx가 같은 origin 위에서 프론트+API 를 같이 서빙하므로 dev가 맞다.
        run: npm run build:dev

      - name: "[5] dist/ 를 tar.gz 로 압축 (파일 340여개 개별전송 대신 1개로 묶어 전송)"
        run: tar -czf dist.tar.gz -C dist .

      - name: "[6] Synology NAS 로 dist.tar.gz 전송 (SCP)"
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SYNOLOGY_HOST }}
          port: ${{ secrets.SYNOLOGY_PORT }}
          username: ${{ secrets.SYNOLOGY_USER }}
          password: ${{ secrets.SYNOLOGY_PASSWORD }}
          key: ${{ secrets.SYNOLOGY_SSH_KEY }}
          source: "ec_v26/shopjoy_v260406/dist.tar.gz"
          target: "/volume1/docker/shopjoy/"
          strip_components: 2

      - name: "[7] NAS 에서 압축 해제 (기존 파일 완전 교체) + 헬스체크"
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SYNOLOGY_HOST }}
          port: ${{ secrets.SYNOLOGY_PORT }}
          username: ${{ secrets.SYNOLOGY_USER }}
          password: ${{ secrets.SYNOLOGY_PASSWORD }}
          key: ${{ secrets.SYNOLOGY_SSH_KEY }}
          script: |
            echo "[7-1] 배포 대상 디렉터리 준비"
            sudo mkdir -p /volume1/docker/shopjoy/frontend
            echo "[7-2] 기존 파일 전체 삭제 (완전 교체 — dist/ 는 항상 자기완결형이므로 잔존파일 위험 없음)"
            sudo rm -rf /volume1/docker/shopjoy/frontend/*
            echo "[7-3] 새 dist 압축 해제"
            sudo tar -xzf /volume1/docker/shopjoy/dist.tar.gz -C /volume1/docker/shopjoy/frontend
            echo "[7-4] 임시 압축파일 정리"
            sudo rm -f /volume1/docker/shopjoy/dist.tar.gz
            echo "[7-5] 배포 결과 확인"
            ls -la /volume1/docker/shopjoy/frontend | head -20
            echo "[7-6] 완료 — nginx 가 이 디렉터리를 이미 마운트 중이면 다음 요청부터 바로 반영됨"
