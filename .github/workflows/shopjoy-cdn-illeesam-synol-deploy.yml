# shopjoy-cdn-illeesam-synol-deploy.yml — 2026-09-06 신설.
#
# shopjoy-be-illeesam-synol-deploy.yml(EcAdminApi 배포) 과 완전히 동일한 패턴 — 대상만
# EcCdnApi(동영상/이미지/파일 CDN 서버)로 바꿨다. EcAdminApi 와 별도 배포 단위라 워크플로도
# 별도로 둔다(요청사항: "deploy:dev-synol-be-ecCdnApi 를 GitHub 에서 바로 실행할 수 있게").
#
# main에 push 되면 트리거는 되지만, 실제 빌드+배포는 커밋 메시지에 정확히
# 'deploy_dev-github-be-cdn' 또는 'deploy_dev-github-full' 토큰이 들어있을 때만 진행한다
# (npm run deploy:dev-github-be-cdn 이 이 토큰을 커밋 메시지에 실어 보낸다).
# (workflow_dispatch로 수동 실행할 땐 이 토큰 체크 없이 무조건 진행됨)
#
# 흐름: Gradle 빌드(GitHub 러너) → Docker 이미지 빌드 → 이미지 tar.gz 압축 →
#   docker-compose.yml 과 함께 NAS 로 전송 → NAS 에서 docker load(재빌드 안 함) →
#   docker compose up -d (eccdnapi 컨테이너 기동/갱신, shopjoy-net 은 EcAdminApi 쪽이 이미
#   만들어둔 것을 external 로 공유) → 헬스체크.
#
# ⚠️ 전제조건(최초 1회, 로컬 스크립트로 배포했을 때와 동일):
#   1) EcAdminApi 쪽 compose(nginx 포함)가 먼저 떠서 "shopjoy-net" 네트워크가 만들어져 있을 것
#   2) /volume1/docker/shopjoy/eccdnapi/.env 가 NAS 에 수동으로 준비되어 있을 것(CF_JWT_SECRET 등)
#   3) _doc/ddl_pgsql/ec/cf_client.sql, cf_file.sql 이 DB 에 적용 + cf_client 계정 시딩되어 있을 것
#
# NAS 배포 경로: /volume1/docker/shopjoy/eccdnapi/ (docker-compose.yml 위치)
# docker-compose.yml 원본 위치: ec_v26/shopjoy_v260406/_apps_be/EcCdnApi/docker-compose.yml
#
# 필요 시크릿(shopjoy-be-illeesam-synol-deploy.yml 과 완전히 동일한 것을 그대로 재사용 —
# 리포지토리 Settings → Secrets and variables → Actions 에 이미 등록되어 있음):
#   SYNOLOGY_HOST / SYNOLOGY_PORT / SYNOLOGY_USER / SYNOLOGY_PASSWORD / SYNOLOGY_SSH_KEY

name: shopjoy-cdn-illeesam-synol-deploy

on:
  push:
    branches: [main]
    paths:
      - 'ec_v26/shopjoy_v260406/_apps_be/EcCdnApi/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 커밋 메시지에 이 워크플로 전용 토큰(deploy_dev-github-be-cdn) 또는 전체트리거 토큰
    # (deploy_dev-github-full) 이 있어야 진행.
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'deploy_dev-github-be-cdn') ||
      contains(github.event.head_commit.message, 'deploy_dev-github-full')

    steps:
      # ─────────────────────────────────────────
      # [1] 체크아웃 + 환경 확인
      # ─────────────────────────────────────────
      - name: "[1-1] 소스코드 체크아웃"
        uses: actions/checkout@v4

      - name: "[1-2] 체크아웃 확인"
        run: |
          echo "브랜치  : ${{ github.ref_name }}"
          echo "커밋SHA : ${{ github.sha }}"
          echo "커밋메시지: ${{ github.event.head_commit.message }}"
          echo "작성자  : ${{ github.actor }}"
          echo "시각    : $(date '+%Y-%m-%d %H:%M:%S')"

      # ─────────────────────────────────────────
      # [2] JDK 설정 + Gradle 빌드
      # ─────────────────────────────────────────
      - name: "[2-1] JDK 17 설정"
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: "[2-2] Gradle 빌드 (테스트 제외)"
        working-directory: ec_v26/shopjoy_v260406/_apps_be/EcCdnApi
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test --no-daemon
          ls -lh build/libs/

      # ─────────────────────────────────────────
      # [3] Docker 이미지 빌드 + 압축
      # ─────────────────────────────────────────
      - name: "[3-1] Docker 이미지 빌드 (docker-compose.yml 의 image: 태그와 일치시킴)"
        working-directory: ec_v26/shopjoy_v260406/_apps_be/EcCdnApi
        run: |
          docker build \
            --tag shopjoy/eccdnapi:latest \
            --tag shopjoy/eccdnapi:${{ github.sha }} \
            --build-arg BUILD_DATE=$(date '+%Y-%m-%d') \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            .
          docker images | grep shopjoy/eccdnapi

      - name: "[3-2] Docker 이미지 tar.gz 압축"
        working-directory: ec_v26/shopjoy_v260406/_apps_be/EcCdnApi
        run: |
          docker save shopjoy/eccdnapi:latest | gzip > eccdnapi-image.tar.gz
          echo "압축파일 크기: $(du -sh eccdnapi-image.tar.gz | cut -f1)"

      # ─────────────────────────────────────────
      # [4] 배포용 설정파일 한 곳에 모으기 (docker-compose.yml 하나뿐 — nginx 설정은
      #     EcAdminApi 쪽이 소유)
      # ─────────────────────────────────────────
      - name: "[4-1] 설정파일 모음 (deploy_pkg/)"
        run: |
          mkdir -p ec_v26/shopjoy_v260406/deploy_pkg_cdn
          cp "ec_v26/shopjoy_v260406/_apps_be/EcCdnApi/docker-compose.yml" ec_v26/shopjoy_v260406/deploy_pkg_cdn/
          ls -la ec_v26/shopjoy_v260406/deploy_pkg_cdn/

      # ─────────────────────────────────────────
      # [5] Synology NAS 로 전송 (SCP)
      # ─────────────────────────────────────────
      - name: "[5-1] 설정파일 전송"
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SYNOLOGY_HOST }}
          port: ${{ secrets.SYNOLOGY_PORT }}
          username: ${{ secrets.SYNOLOGY_USER }}
          password: ${{ secrets.SYNOLOGY_PASSWORD }}
          key: ${{ secrets.SYNOLOGY_SSH_KEY }}
          source: "ec_v26/shopjoy_v260406/deploy_pkg_cdn/docker-compose.yml"
          target: "/volume1/docker/shopjoy/eccdnapi/"
          strip_components: 3

      - name: "[5-2] Docker 이미지 전송"
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SYNOLOGY_HOST }}
          port: ${{ secrets.SYNOLOGY_PORT }}
          username: ${{ secrets.SYNOLOGY_USER }}
          password: ${{ secrets.SYNOLOGY_PASSWORD }}
          key: ${{ secrets.SYNOLOGY_SSH_KEY }}
          source: "ec_v26/shopjoy_v260406/_apps_be/EcCdnApi/eccdnapi-image.tar.gz"
          target: "/volume1/docker/shopjoy/eccdnapi/"
          strip_components: 4

      # ─────────────────────────────────────────
      # [6] NAS 에서 이미지 로드 + docker compose 배포
      # ─────────────────────────────────────────
      - name: "[6-1] 이미지 로드 + docker compose up -d"
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SYNOLOGY_HOST }}
          port: ${{ secrets.SYNOLOGY_PORT }}
          username: ${{ secrets.SYNOLOGY_USER }}
          password: ${{ secrets.SYNOLOGY_PASSWORD }}
          key: ${{ secrets.SYNOLOGY_SSH_KEY }}
          script: |
            cd /volume1/docker/shopjoy/eccdnapi

            echo "[6-1-1] 전송된 파일 확인"
            ls -lh .

            if [ ! -f .env ]; then
              echo "⚠ .env 파일이 없습니다 — 최초 1회 수동으로 준비해야 합니다. 배포를 계속하되"
              echo "  eccdnapi 컨테이너는 필수 환경변수(CF_JWT_SECRET 등) 없이 뜨지 못할 수 있습니다."
            fi

            echo ""
            echo "[6-1-2] 로그·저장소 볼륨 폴더 존재 보장"
            mkdir -p /volume1/docker/eccdnapi/logs /volume1/docker/shopjoy/cdn-storage

            echo ""
            echo "[6-1-3] 새 이미지 로드 (재빌드 없음 — NAS 는 미리 빌드된 이미지만 import)"
            sudo docker load < eccdnapi-image.tar.gz

            echo ""
            echo "[6-1-4] docker compose 로 스택 기동/갱신"
            sudo docker compose up -d

            echo ""
            echo "[6-1-5] 임시 압축파일 정리"
            rm -f eccdnapi-image.tar.gz

            echo ""
            echo "[6-1-6] 컨테이너 상태 확인"
            sleep 5
            sudo docker compose ps

            echo ""
            echo "[6-1-7] eccdnapi 초기 로그"
            sudo docker compose logs --tail 30 eccdnapi

      # ─────────────────────────────────────────
      # [7] 외부 헬스체크
      # ─────────────────────────────────────────
      - name: "[7-1] GitHub Runner → 외부 HTTP 헬스체크"
        if: always()
        run: |
          echo ">> nginx 경유 관리 화면 확인 (21000, /cdn-admin/ prefix)"
          curl -s -o /dev/null -w "   HTTP Status: %{http_code}\n" --max-time 10 --connect-timeout 5 \
            "https://21000.illeesam.synology.me/cdn-admin/index.html" || echo "   curl실패"

          echo ""
          echo ">> 백엔드 actuator 헬스체크 (21090, 디버그 직결)"
          URL="http://illeesam.synology.me:21090/actuator/health"
          HTTP_CODE=$(curl -s -o /tmp/body.txt -w "%{http_code}" --max-time 10 --connect-timeout 5 "$URL" || echo "curl실패")
          echo "   HTTP Status: $HTTP_CODE"
          [ -s /tmp/body.txt ] && cat /tmp/body.txt | head -20 | sed 's/^/     /'

      # ─────────────────────────────────────────
      # [8] 결과 요약
      # ─────────────────────────────────────────
      - name: "[8-1] 배포 결과 요약"
        if: always()
        run: |
          echo "레포    : ${{ github.repository }}"
          echo "커밋SHA : ${{ github.sha }}"
          echo "결과    : ${{ job.status }}"
          echo "--------------------------------------"
          echo "관리 화면(nginx 경유) : https://21000.illeesam.synology.me/cdn-admin/index.html"
          echo "백엔드 디버그 URL     : http://illeesam.synology.me:21090 (외부 미공개 권장)"
          echo "헬스체크(디버그 직결) : http://illeesam.synology.me:21090/actuator/health"
          echo "--------------------------------------"
          echo "Synology SSH 수동 확인 명령어"
          echo "  cd /volume1/docker/shopjoy/eccdnapi"
          echo "  sudo docker compose ps"
          echo "  sudo docker compose logs -f eccdnapi"
          echo "  sudo docker compose restart eccdnapi"
