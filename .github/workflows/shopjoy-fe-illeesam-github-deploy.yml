# shopjoy-fe-illeesam-github-deploy.yml — 2026-09-02 (구 shopjoy-frontend-deploy-pages.yml 이름변경)
#
# GitHub Actions로 빌드 후 dist/ 만 GitHub Pages에 배포.
#
# main에 push 되면 일단 트리거는 되지만, 실제 빌드+배포는 커밋 메시지에 "deploy" 또는
# "배포"라는 단어가 들어있을 때만 진행한다(아래 build 잡의 if 조건). 그 단어가 없는
# 평범한 커밋은 이 워크플로가 곧바로 스킵 처리된다 — 매 push마다 배포하고 싶지 않을 때 사용.
# (workflow_dispatch로 수동 실행할 땐 이 단어 체크 없이 무조건 진행됨)
#
# 예) git commit -m "OO 기능 deploy" 또는 git commit -m "긴급 배포: OO 수정"
#
# npm run build:prod(esbuild 압축 + prod 프로파일 env 적용 + lazy 정합성 검증) → dist/ 산출물만
# GitHub Pages에 올린다. 원본 소스(pages/lib/components 등)는 Pages에 노출되지 않는다.
# 빌드 검증(shopjoy-fe-illeesam-github-build.yml)과는 별개 워크플로 — 그쪽은 배포 안 하고 검증만 함.
# 같은 dist/ 를 Synology NAS 에도 따로 배포하려면 shopjoy-fe-illeesam-synol-deploy.yml 참조.
#
# GitHub Pages는 순수 정적 호스팅이라 백엔드가 같이 안 떠 있다(NAS 배포와 결정적으로 다른 점).
#   2026-09-06 대개편 이후 lib/env/profiles/env{Bo,Fo}Consts.prod.js 의 baseApiHost/cdnApiHost
#   기본값이 이미 백엔드/CDN 절대 서브도메인(22300/22400.illeesam.synology.me)이라 — "4개 앱이
#   각자 다른 호스팅사에 흩어질 수도 있다"는 최악의 경우 기준 설계 전환 덕분에, 이 GitHub Pages
#   배포도 별도 수정 없이 그 백엔드/CDN을 그대로 호출한다(CORS는 CorsOriginPolicy.java 가 처리).
#   별도의 진짜 다른 백엔드/CDN 서버로 바꾸고 싶을 때만 그 두 파일의 값을 수정하면 된다.
#
# ⚠ 최초 1회 수동 설정 필요: 리포지토리 Settings → Pages → Build and deployment →
#   Source 를 "GitHub Actions" 로 선택해야 이 워크플로가 실제로 Pages에 반영됨.
#
# verify-dist(=npm run build:prod 안에 포함) 가 실패하면 이 워크플로도 실패 처리되어
# Pages 배포가 진행되지 않는다 — 깨진 dist가 그대로 배포되는 일은 없음.

name: shopjoy-fe-illeesam-github-deploy

on:
  push:
    branches: [main]
    paths:
      - 'ec_v26/shopjoy_v260406/apps/ecFeBo/pages/**'
      - 'ec_v26/shopjoy_v260406/apps/ecFeBo/lib/**'
      - 'ec_v26/shopjoy_v260406/apps/ecFeBo/components/**'
      - 'ec_v26/shopjoy_v260406/apps/ecFeBo/assets/**'
      - 'ec_v26/shopjoy_v260406/apps/ecFeBo/scripts/**'
      - 'ec_v26/shopjoy_v260406/apps/ecFeBo/*.html'
      - 'ec_v26/shopjoy_v260406/apps/ecFeBo/package.json'
  workflow_dispatch: {}

defaults:
  run:
    working-directory: ec_v26/shopjoy_v260406/apps/ecFeBo

permissions:
  contents: read
  pages: write
  id-token: write

# 같은 브랜치에 대해 배포가 겹치지 않도록 직렬화 (진행 중인 배포는 취소하지 않고 대기)
concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 커밋 메시지에 deploy/Deploy/DEPLOY/배포 중 하나라도 있어야 진행.
    # workflow_dispatch(수동 실행)는 head_commit 이 없으므로 항상 통과.
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'deploy') ||
      contains(github.event.head_commit.message, 'Deploy') ||
      contains(github.event.head_commit.message, 'DEPLOY') ||
      contains(github.event.head_commit.message, '배포')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ec_v26/shopjoy_v260406/apps/ecFeBo/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: "minify 빌드(prod 프로파일) + dist 정합성 검증 (실패 시 배포 중단)"
        run: npm run build:prod

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: dist/ 를 Pages 아티팩트로 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: ec_v26/shopjoy_v260406/apps/ecFeBo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages에 배포
        id: deployment
        uses: actions/deploy-pages@v4
