# shopjoy-be-illeesam-synol-build.yml — 2026-09-02 신설 (구 deploy-ec-admin.yml 에서
# 빌드검증 부분만 분리).
#
# EcAdminApi(백엔드) 소스가 바뀔 때마다 Gradle 빌드가 실제로 성공하는지만 확인한다.
# Docker 이미지 빌드/NAS 전송/배포는 전혀 하지 않는다 — 순수 컴파일 검증(CI) 게이트.
# shopjoy-be-illeesam-synol-deploy.yml(실제 배포) 앞단 게이트 역할이며, NAS 접속 정보/
# 시크릿이 전혀 필요 없다.
name: shopjoy-be-illeesam-synol-build

on:
  push:
    branches: [main]
    paths:
      - 'ec_v26/shopjoy_v260406/_apps_be/EcAdminApi/**'
  pull_request:
    paths:
      - 'ec_v26/shopjoy_v260406/_apps_be/EcAdminApi/**'

defaults:
  run:
    working-directory: ec_v26/shopjoy_v260406/_apps_be/EcAdminApi

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: "[1] 소스코드 체크아웃"
        uses: actions/checkout@v4

      - name: "[2] JDK 17 설정"
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: "[3] gradlew 실행 권한 부여"
        run: chmod +x gradlew

      - name: "[4] Gradle 빌드 (테스트 제외, 캐시 미정리 — CI 는 매번 새 러너라 무의미)"
        run: ./gradlew build -x test --no-daemon

      - name: "[5] 빌드 결과물 확인"
        run: |
          ls -lh build/libs/
          JAR_FILE=$(ls build/libs/*.jar | head -1)
          echo "빌드된 JAR: $JAR_FILE ($(du -sh "$JAR_FILE" | cut -f1))"
