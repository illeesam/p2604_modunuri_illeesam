<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주문 프로모션 상세</title>
  <script>
    // BO 사이트 번호 (팝업은 항상 01)
    window.BO_SITE_NO = '01';
  </script>
  <link rel="stylesheet" href="assets/css/bo-global-style01.css">
  <style>
    /* 팝업 전용 기본 */
    body { margin: 0; background: #f5f6fa; font-size: 13px; }
    #app { min-height: 100vh; overflow: auto; }

    /* 토스트 — 팝업에는 boApp 의 토스트 시스템이 없어 자체 구현 */
    .popup-toast {
      position: fixed; right: 18px; bottom: 18px; z-index: 9999;
      padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,.18); display: none; max-width: 420px;
    }
    .toast-success { background: #52c41a; color: #fff; }
    .toast-error   { background: #ff4d4f; color: #fff; }
    .toast-warning { background: #faad14; color: #fff; }
    .toast-info    { background: #1677ff; color: #fff; }
  </style>
</head>
<body>
<div id="app"></div>

<!-- 자체 토스트 (Vue 앱 밖 — 컴포넌트에 함수로 주입) -->
<div id="popupToast" class="popup-toast"></div>

<!-- ── Vue 3 core ── -->
<script src="assets/cdn/pkg/vue/3.4.21/vue.global.prod.js"></script>
<script src="assets/cdn/pkg/axios/1.7.9/axios.min.js"></script>

<!-- ── 유틸 & API (boApi 는 localStorage 토큰을 그대로 쓴다 — 오프너와 같은 출처라 재로그인 불필요) ── -->
<script src="lib/utils/coUtil.js"></script>
<script src="lib/utils/boApiAxios.js"></script>
<script src="lib/utils/boUtil.js"></script>
<script src="lib/env/boEnvConsts.js"></script>
<script src="lib/services/coApiSvc.js"></script>
<script src="lib/services/boApiSvc.js"></script>

<!-- ── 화면 ── -->
<script src="pages/bo/ec/od/OdOrderPromoPop.js"></script>

<script>
  /* 주문 프로모션 상세 팝업.
     주문항목관리(OdOrderItemMng) 주문ID 그룹헤더의 [프로모션상세] 버튼이 window.open 으로 이 페이지를 연다.
     대상 주문은 URL 쿼리로 받는다 (?orderId=...). */
  const { createApp } = Vue;

  const _q = new URLSearchParams(location.search);
  const _orderId = _q.get('orderId') || null;

  if (_orderId) { document.title = '주문 프로모션 상세 · ' + _orderId; }

  /* ── 토스트 ── */
  let _toastTid = null;
  const showToast = (msg, type = 'success', duration = 3500) => {
    const el = document.getElementById('popupToast');
    el.className = 'popup-toast toast-' + (type || 'success');
    el.textContent = msg;
    el.style.display = 'block';
    clearTimeout(_toastTid);
    /* duration 0 은 "수동 닫힘" 규약 — 오류 토스트가 스스로 사라지지 않게 한다 */
    if (duration > 0) { _toastTid = setTimeout(() => { el.style.display = 'none'; }, duration); }
    else { el.onclick = () => { el.style.display = 'none'; }; }
  };

  const app = createApp({
    setup() {
      return { orderId: _orderId, showToast };
    },
    template: `<od-order-promo-pop :order-id="orderId" :show-toast="showToast" />`,
  });

  app.component('OdOrderPromoPop', window.OdOrderPromoPop);
  app.mount('#app');
</script>
</body>
</html>
