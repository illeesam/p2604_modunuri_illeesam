<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopJoy MFE Demo — 시스템</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%99%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <script>
    /* shopjoy_v260406/bo.html 의 BO_SITE_NO 부트스트랩을 단순화 — 이 데모는 항상 01 사이트만 사용 */
    window.BO_SITE_NO = '01';
    try {
      localStorage.setItem('modu-bo-sy-siteNo', '01');
      localStorage.setItem('modu-bo-sy-siteId', '2604010000000001');
    } catch (e) {}
  </script>

  <!-- ■ 메인프레임 공용 런타임 — shopjoy_v260406/assets/cdn/pkg 원본 그대로 재사용 ■ -->
  <script src="assets/cdn/pkg/vue/3.4.21/vue.global.prod.js"></script>
  <script src="assets/cdn/pkg/vue-demi/0.14.10/vue-demi.iife.js"></script>
  <script src="assets/cdn/pkg/axios/1.7.9/axios.min.js"></script>
  <script src="assets/cdn/pkg/yup/1.0.0.shim/yup.js"></script>
  <script src="assets/cdn/pkg/pinia/2.1.7/pinia.iife.js"></script>
  <!-- echarts — 이 대메뉴(bo-sy)는 안 쓰지만 메인프레임이 상시 제공하는 공용 런타임의 일부라 그대로 로드 -->
  <script src="assets/cdn/pkg/echarts/5.6.0/echarts.min.js"></script>

  <!-- jsPDF + html2canvas: 화면 영역을 그대로 캡처해 PDF 로 내려받는 기능용(boUtil.bofExportPdf).
       한글을 jsPDF 자체 폰트로 그리면 CJK 미지원이라 깨지므로, html2canvas 로 화면을 이미지화한
       뒤 jsPDF 에 얹는 방식(2026-08-29 — 기존엔 이 두 스크립트가 아예 빠져 있어서 PDF 다운로드
       버튼을 누르면 "PDF 라이브러리가 로드되지 않았습니다" 로 실패했다). -->
  <script src="assets/cdn/pkg/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="assets/cdn/pkg/jspdf/2.5.2/jspdf.umd.min.js"></script>

  <!-- 외부 SDK(소셜 로그인/공유/결제) — 키는 로그인 후 server init data 로 주입(coExtSdk.js).
       2026-08-29 — 카카오공유하기/소셜로그인 버튼이 이 스크립트 없이는 전부 실패했다. -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js"
          integrity="sha384-TiCUE00h649CAMonG018J2ujOgDKW/kVWlChEuu4jK2vxfAAD0eZxzCKakxg55G4"
          crossorigin="anonymous"></script>
  <script src="https://static.nid.naver.com/js/naveridlogin_js_sdk_2.0.2.js" charset="utf-8"></script>
  <script src="https://js.tosspayments.com/v2/standard"></script>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/bo-global-style01.css">
  <link rel="stylesheet" href="assets/css/mfe-style.css">

  <div id="app"></div>

  ═══════════════════════════════════════════════════════════════════ -->
  <script src="lib/license/licenseBo.js"></script>

  <!-- ═══════════════════════════════════════════════════════════════════
       mfe.html(전체 7개 대메뉴)의 축소판 — 지연로드 전환(2026-08-28) 이후로는
       mfe.html 과 똑같이 카탈로그(가벼운 목차) 전체를 로드해도 무방하다(코드는
       안 실리니 비용이 거의 없다). 진짜 차이는 아래 mfeBootShell() 인자 — 대메뉴를
       "bo-sy" 하나만 넘겨서 상단바엔 시스템만 뜨고, 실제로 클릭해야만 bo-sy-ba/bo-sy-org

       클릭할 방법이 없으니 사실상 안 불러오는 것과 같다. -->
  <script src="lib/mfe/mfeRegistry.js"></script>
  <script src="lib/mfe/mfeCatalog.js"></script>

  <script src="lib/mfe/mfeShell.js"></script>
  <script>
    window.mfeBootShell([
      { key: 'bo-sy', label: '시스템', icon: '⚙️' },
    ]);
  </script>
