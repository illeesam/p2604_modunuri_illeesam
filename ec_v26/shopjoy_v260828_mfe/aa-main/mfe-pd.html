       ab-home/cu-ba/cu-co/sy-ba/sy-org 는 전혀 안 불러온다. pd-pd(상품)와
       pd-cate(카테고리) 둘 다 window.MFE_REGISTRY.register("pd", ...) 로 같은
       menuKey 에 등록하므로, 셸의 groupedMenuOf('pd') 가 자동으로 두 소그룹으로
       묶어 좌측 메뉴에 그린다 — 이 파일은 그 조합만 부팅 목록에서 골라낸 것뿐,

  ═══════════════════════════════════════════════════════════════════ -->

  <script src="../pd-cate/manifest.js"></script>

      { key: 'pd', label: '상품관리', icon: '📦' },
