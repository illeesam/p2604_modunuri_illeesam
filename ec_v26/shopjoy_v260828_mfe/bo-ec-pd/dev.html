  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
  <script>
    /* bo-ap-global/mfe.html 과 동일한 BO_SITE_NO 부트스트랩 */
    window.BO_SITE_NO = '01';
    try {
      localStorage.setItem('modu-bo-sy-siteNo', '01');
      localStorage.setItem('modu-bo-sy-siteId', '2604010000000001');
    } catch (e) {}
  </script>

  <!-- ═══════════════════════════════════════════════════════════════════
       이 화면은 "상품관리" 도메인 레포(이 폴더) 를 다른 도메인(bo-ap-home/bo-ec-cu-ba/bo-ec-cu-co/bo-sy-ba/bo-sy-org) 없이,
       메인프레임(../bo-ap-global/)의 공용 런타임만으로 단독 실행한다 — 이게 되면
       이 도메인이 다른 도메인에 의존하지 않고 셸의 "런타임 계약"에만 의존한다는
       증거가 된다. 실제로 레포를 분리한다면, 여기 ../bo-ap-global/ 경로들은 배포된
       메인프레임의 URL(예: 사내 CDN, 스테이징 서버)로 바뀌는 자리다.
  ═══════════════════════════════════════════════════════════════════ -->

  <!-- ■ 메인프레임 공용 런타임 (../bo-ap-global/ 참조 — bo-ap-global/mfe.html 과 동일 목록) ■ -->
  <script src="../bo-ap-global/assets/cdn/pkg/vue/3.4.21/vue.global.prod.js"></script>
  <script src="../bo-ap-global/assets/cdn/pkg/vue-demi/0.14.10/vue-demi.iife.js"></script>

  <script src="../bo-ap-global/assets/cdn/pkg/echarts/5.6.0/echarts.min.js"></script>

  <!-- jsPDF + html2canvas: 화면 영역을 그대로 캡처해 PDF 로 내려받는 기능용(boUtil.bofExportPdf).
       한글을 jsPDF 자체 폰트로 그리면 CJK 미지원이라 깨지므로, html2canvas 로 화면을 이미지화한
       뒤 jsPDF 에 얹는 방식(2026-08-29 — 기존엔 이 두 스크립트가 아예 빠져 있어서 PDF 다운로드
       버튼을 누르면 "PDF 라이브러리가 로드되지 않았습니다" 로 실패했다). -->
  <script src="../bo-ap-global/assets/cdn/pkg/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="../bo-ap-global/assets/cdn/pkg/jspdf/2.5.2/jspdf.umd.min.js"></script>
