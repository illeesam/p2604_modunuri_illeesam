  <script src="assets/cdn/pkg/prism/1.29.0/components/prism-csharp.min.js"></script>

  <!-- ■ B3.5: 소스젠 생성 엔진 (p2605_sourcegen 이식 — 전역 gnParseDdl/gnGenerate 노출) ■
       sourcegen.js 가 진입점(gnGenerate)이고 나머지는 스택별 생성 함수를 전역에 얹는다.
       브라우저 전역 스코프 공유 방식이라 순서는 sourcegen.js 가 먼저여도 무방(호출 시점에 이미 전부 로드됨).
       스택별 파일은 backend/frontend/fullstack 폴더 + {스택}_v1.js 로 정리(2026-08-26). -->
  <script src="assets/md/sg/sourcegen/sourcegen.js"></script>
  <script src="assets/md/sg/sourcegen/backend/jpa_v1.js"></script>
  <script src="assets/md/sg/sourcegen/backend/mybatis_v1.js"></script>
  <script src="assets/md/sg/sourcegen/backend/python_v1.js"></script>
  <script src="assets/md/sg/sourcegen/backend/csharp_efcore_v1.js"></script>

  <!-- ■ B4.1: 이 모듈의 콘텐츠 컴포넌트 (pages/md/sg/) — 목록/상세 분리 ■ -->
  <script src="pages/md/sg/MdSgProjectListPage.js"></script>

  <!-- ■ B99: 메인 앱 부트스트랩 (반드시 마지막) ■ -->
  <script>
    (function () {
      const { createApp, computed } = Vue;

      const pinia = Pinia.createPinia();
      window.foAuth.init(pinia);

      const ModuleRoot = {
        name: 'SgSourcegenModuleRoot',
        setup() {
          const shell = window.foModuleShell.create();
          /* 이 모듈은 index.html 라우팅 밖이라 page 값이 고정 — 헤더/사이드바가 현재 메뉴를
             하이라이트할 근거로만 쓰고, 실제 화면 전환에는 관여하지 않는다. */
          const page = computed(() => 'sourcegen');
          /* 목록/상세 2뷰 — 쿼리스트링 기준(해시 라우터 없이 전체 새로고침으로 전환).
             view=editor 이거나 projectId 가 있으면 상세(편집), 그 외엔 목록. */
          const qs = new URLSearchParams(location.search);
          const v = qs.get('view');
          const curView = v === 'hist' ? 'hist'
                        : (v === 'editor' || qs.get('projectId')) ? 'editor' : 'list';
          return { ...shell, page, curView };
        },
        template: /* html */`
<div style="min-height:100vh;display:flex;flex-direction:column;">
  <fo-app-header
    :page="page" :theme="theme" :app-sidebar-open="sidebarOpen" :app-mobile-open="uiState.mobileOpen"
    :config="config" :navigate="navigate" :toggle-theme="toggleTheme" :app-cart-count="cfCartCount" :app-like-count="cfLikeCount"
    :app-auth="auth" :on-app-show-login="onShowLogin" :on-app-logout="onLogout"
    :app-show-settings="showSettings" :app-show-api-log="showApiLog"
    :app-api-logs="foApiLogs" :app-api-toast="apiToastEnabled"
    @modu-fo-toggle-sidebar="sidebarOpen=!sidebarOpen" @modu-fo-toggle-mobile="toggleMobileMenu"
    @modu-fo-toggle-settings="showSettings=!showSettings"
    @modu-fo-toggle-api-log="onToggleApiLog"
    @modu-fo-toggle-api-toast="onToggleApiToast"
  />
  <div style="flex:1;display:flex;overflow:hidden;position:relative;">
    <fo-app-sidebar
      v-show="cfShowSidebar || uiState.mobileOpen"
      :page="page" :app-sidebar-open="sidebarOpen" :app-mobile-open="uiState.mobileOpen"
      :config="config" :navigate="navigate" :app-cart-count="cfCartCount" :app-auth="auth"
      @modu-fo-toggle-sidebar="sidebarOpen=!sidebarOpen" @modu-fo-close-mobile="closeMobileMenu"
    />
    <div class="sidebar-overlay" :class="{show: uiState.mobileOpen}" @click="closeMobileMenu"></div>
    <main class="layout-main" style="flex:1;overflow-y:auto;min-width:0;">
      <md-sg-project-list-page v-if="curView==='list'" :show-toast="showToast" :show-confirm="showConfirm" />
      <md-sg-gen-hist-list-page v-else-if="curView==='hist'" :show-toast="showToast" :show-confirm="showConfirm" />
      <md-sg-sourcegen-page v-else :show-toast="showToast" :show-confirm="showConfirm" />
      <fo-app-footer :config="config" :navigate="navigate" />
    </main>
  </div>

  <login v-if="uiState.showLogin" :show-toast="showToast" @close="uiState.showLogin=false" />

  <div v-if="toasts.length" class="sg-toast-stack">
    <div v-for="t in toasts" :key="t.id" class="sg-toast" :class="t.type">{{ t.msg }}</div>
  </div>

  <!-- CONFIRM MODAL — index.html(foAppBase.js)과 동일한 디자인 컨펌(window.confirm() 대체) -->
  <div v-if="confirmState.show" class="modal-overlay" style="z-index:10000;" @click.self="closeConfirm(false)">
    <div class="modal-box">
      <div class="modal-icon icon-warning">⚠️</div>
      <div class="modal-title">{{ confirmState.title }}</div>
      <div class="modal-msg">{{ confirmState.msg }}</div>
      <div class="modal-actions" style="gap:10px;">
        <button class="btn-outline" @click="closeConfirm(false)" style="padding:10px 20px;">취소</button>
        <button class="btn-blue" @click="closeConfirm(true)" style="padding:10px 20px;">확인</button>
      </div>
    </div>
  </div>
</div>
`,
      };

      const app = createApp(ModuleRoot);
      app.use(pinia);
      /* foRegisterComponents(app) 는 체이닝 도중 window.X 가 undefined 면 체인이 끊겨 크래시한다.
         이 모듈은 일부 컴포넌트만 로드하므로 체이닝 없이 개별 호출로 등록한다. */
      app.component('FoAppHeader', window.foAppHeader);
      app.component('FoAppSidebar', window.foAppSidebar);
      app.component('FoAppFooter', window.foAppFooter);
      app.component('Login', window.Login);
      app.component('FoPage', window.FoPage);
      app.component('FoContainer', window.FoContainer);
      app.component('FoSearchArea', window.FoSearchArea);
      app.component('FoFormArea', window.FoFormArea);
      app.component('FoGrid', window.FoGrid);
      app.component('FoGridCrud', window.FoGridCrud);
      app.component('FoModal', window.FoModal);
      app.component('FoRowCancelDelete', window.FoRowCancelDelete);
      app.component('FoPager', window.FoPager);
      app.component('FoTabBar', window.FoTabBar);
      app.component('BaseAttachGrp', window.BaseAttachGrp);
      app.component('BaseHtmlEditor', window.BaseHtmlEditor);
      app.component('BoMultiCheckSelect', window.BoMultiCheckSelect);
      app.component('MdSgProjectListPage', window.MdSgProjectListPage);
      app.component('MdSgGenHistListPage', window.MdSgGenHistListPage);
      app.component('MdSgSourcegenPage', window.MdSgSourcegenPage);
      app.mount('#app');

      const loadingEl = document.getElementById('_boot_loading');
      if (loadingEl) {
        loadingEl.classList.add('done');
        setTimeout(() => { if (loadingEl.parentNode) loadingEl.parentNode.removeChild(loadingEl); }, 350);
      }
    })();
  </script>
</body>
</html>
