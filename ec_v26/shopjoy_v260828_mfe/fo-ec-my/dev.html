  <script>
    window.FO_SITE_NO = '01';
    try {
      localStorage.setItem('modu-fo-sy-siteNo', '01');
      localStorage.setItem('modu-fo-sy-siteId', '2604010000000001');
    } catch (e) {}
    /* 이 레포엔 'home' 이 없으므로 기본 진입 페이지를 이 레포가 담당하는 화면으로
       지정한다 — 다른 dev.html 도 각자 자기 화면으로 지정(패턴 동일). */
    (function () {
      try {
        var qs = new URLSearchParams(location.search);
        if (!qs.has('page')) {
          qs.set('page', 'myOrder');
          history.replaceState(null, '', location.pathname + '?' + qs.toString());
        }
      } catch (e) {}
    })();
  </script>
