# ═══════════════════════════════════════════════════════════
#  ShopJoy Gateway (테스트 전용) - Docker Compose
# ═══════════════════════════════════════════════════════════
#  배치 위치: apps/ecGateway/docker-compose.yml
#  실행 명령: docker compose up -d   (이미지만 pull — 빌드 대상 없음, 공식 nginx 이미지 그대로 사용)
#
#  2026-09-06 신설 — "4개 앱(ecBeBo/ecBeCdn/ecFeBo/ecBeRedis)이 각자 다른 호스팅사에 흩어질
#  수도 있다"는 최악의 경우 기준으로 apps/ecFeBo 의 nginx에서 리버스프록시 역할을 완전히
#  제거했는데(정적 파일만 서빙), 이 컨테이너는 "다 같은 NAS에 co-located일 때 예전처럼 한
#  origin 으로 묶어서 테스트하고 싶다"는 용도로만 별도로 만든 것 — 정식 배포 경로가 아니다.
#  ecBeBo/ecBeCdn/ecFeBo 각자의 독립 배포가 여전히 원칙이며, 이 게이트웨이는 그 세 컨테이너가
#  전부 이 NAS에 이미 떠 있어야만(호스트 포트 22300/22400/정적파일) 동작한다.
#
#  ⚠️ 테스트용이라 restart 정책도 unless-stopped 가 아니라 "no"로 둔다 — NAS 재부팅 시
#     자동으로 다시 뜨지 않는 게 맞다(상시 운영 컨테이너가 아니므로).
# ═══════════════════════════════════════════════════════════

services:
  ecgateway:
    image: nginx:1.27-alpine
    container_name: shopjoy-ecGateway-22099

    # ───── 호스트(같은 NAS의 ecBeBo/ecBeCdn) 접근 ─────
    # Docker 내부 DNS 이름이 아니라 host.docker.internal:{포트}로 부른다(nginx.conf 참조) —
    # shopjoy-net 같은 공유 네트워크를 다시 만들지 않기 위해서다(이 컨테이너도 완전 독립).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # ───── 포트 매핑 ─────
    ports:
      - "22099:80"

    # ───── 볼륨 마운트 ─────
    # nginx.conf/locations.conf/security-headers.conf: 이 compose 파일과 같은 디렉터리.
    # html: ecFeBo 가 이미 배포해둔 정적 파일 루트를 그대로 재사용(읽기전용, 별도 배포 불필요) —
    #   npm run deploy:dev-synol-ecFeBo 가 채워둔 그 폴더를 이 게이트웨이도 같이 읽는다.
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./locations.conf:/etc/nginx/locations.conf:ro
      - ./security-headers.conf:/etc/nginx/security-headers.conf:ro
      - /volume1/docker/shopjoy/ecFeBo:/usr/share/nginx/html:ro

    restart: "no"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

# 다른 컨테이너와 네트워크를 공유하지 않는다(host.docker.internal 경유로만 통신) — 별도
# networks: 블록 없이 compose 기본 네트워크만 사용.
