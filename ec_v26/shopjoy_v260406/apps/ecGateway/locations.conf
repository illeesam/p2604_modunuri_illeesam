# apps/ecGateway/locations.conf — 2026-09-06 신설. apps/ecFeBo 로 완전 분리하기 전 옛
# ecBeBo/nginx-locations.conf 의 프록시 판별 규칙을 테스트용 게이트웨이로 복원한 것.
#
# 판별 원칙(rename 불필요 — 2026-09-06 대화에서 확인): ecBeBo/ecBeCdn의 API 경로는 이미
# 겹치지 않는다 — ecBeCdn 은 /api/cdn/** 하나만 쓰고(인증·바이너리 서빙 컨트롤러도 전부 이
# prefix 아래로 통합, 2026-09-06 2차 정리) ecBeBo 는 이 prefix 를 전혀 쓰지 않는다(코드 전수
# grep 확인). nginx 는 prefix location 끼리 "더 긴(구체적인) prefix"를 우선 매치하므로,
# /api/cdn/ 를 먼저 CDN으로 보내고 나머지 /api/ 는 전부 BE로 보내는 것만으로 자동 판별된다 —
# /api/shopjoybo, /api/shopjoycdn 같은 별도 네임스페이스 분리는 필요 없다.

# ── ① CDN 로컬 패키지 — 버전 경로 고정이라 1년 캐시. 정규식(~)끼리는 선언 순서가 우선이라
#    ③(js/css/html)보다 먼저 와야 한다. ──
location ~* ^/assets/cdn/pkg/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# ── ② 이미지/폰트류 — 7일 캐시. ──
location ~* \.(png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot)$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=604800" always;
}

# ── ③ 앱 소스(JS/CSS/HTML) — "빌드 없음" 구조라 no-cache(매번 서버에 확인). ──
location ~* \.(js|css|html)$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache" always;
}

# ── Swagger/OpenAPI 문서 — ecBeBo(ec_admin_api). 2026-09-06 신설(요청사항: "swagger 도
#    추가해주고"). /swagger-ui/index.html 은 확장자가 .html 이라 아래 ③(정적 html) 정규식
#    location 이 먼저 가로채 nginx 자체 404(정적 루트에 그 파일이 없음)를 내버린다 — 정규식은
#    prefix location 보다 원래 우선순위가 높지만, ^~ 를 붙인 prefix location 은 "가장 긴
#    prefix 로 일치하면 정규식 검사 자체를 건너뛴다"는 예외 규칙을 이용해 역전시킨다.
location ^~ /swagger-ui/ {
    proxy_pass http://ec_admin_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
# swagger-ui 가 스펙을 읽어오는 API(springdoc.api-docs.path, application.yml 참조).
location /v3/api-docs {
    proxy_pass http://ec_admin_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── ④ 백엔드 API/SEO 랜딩 — ecBeBo(ec_admin_api) ──
location /api/ {
    proxy_pass http://ec_admin_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
location /foui/ {
    proxy_pass http://ec_admin_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
# /cdn/** — ecBeBo 가 직접 서빙하는 사용자 업로드 이미지 등(WebConfig.java).
location /cdn/ {
    proxy_pass http://ec_admin_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Cache-Control "public, max-age=86400" always;
}

# /api/cdn/ — ecBeCdn(ec_cdn_api) 전체(로그인/재발급, cf_client·cf_file CRUD, 업로드/삭제,
# 원본/썸네일/프레임/스트리밍 바이너리 서빙까지 전부 이 prefix 하나로 통일, 2026-09-06 2차 정리
# — 예전엔 /api/auth/·/cf/ 가 별도 location 이었다). /api/ 보다 더 구체적인 prefix 라
# longest-prefix-match 로 이 규칙이 먼저 선택된다(선언 순서 무관 — 정규식(~)과 달리 일반
# prefix location 끼리는 길이로만 경쟁). 동영상 스트리밍(Range 요청)이 이 prefix 밑에 있어
# proxy_buffering off 를 여기서 같이 켜둔다 — 버퍼링을 끄면 첫 바이트를 곧장 클라이언트로
# 흘려보낸다(cf_file 조회 등 나머지 API 는 버퍼링 꺼도 무해).
location /api/cdn/ {
    proxy_pass http://ec_cdn_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# /cdn-admin/ — ecBeCdn 자체 관리자 정적 화면(static/home/**). ecBeCdn 은 이미 이 화면을
# 자기 포트(22400)의 /home/** 로 직접 서빙하지만, 이 게이트웨이(한 origin)에서도 보고 싶을
# 때를 위해 rewrite 로 이어준다. ^~ 로 정규식(③, root=/usr/share/nginx/html)보다 우선시켜야
# ecFeBo 자기 index.html/css/js 와 파일명이 겹쳐도 이 규칙이 이긴다.
location ^~ /cdn-admin/ {
    rewrite ^/cdn-admin/(.*)$ /home/$1 break;
    proxy_pass http://ec_cdn_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# /admin-tools/ — ecBeBo 자체 운영 도구 정적 화면(로그뷰어 등, static/home/**). 위 /cdn-admin/
# 과 같은 이유로 ^~ prefix 필요.
location ^~ /admin-tools/ {
    rewrite ^/admin-tools/(.*)$ /home/$1 break;
    proxy_pass http://ec_admin_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── ⑤ 그 외 전부(루트 index.html/bo.html, favicon 등) — ecFeBo 정적 루트에서 직접 서빙.
#    못 찾으면 ecBeBo로 폴백(옛 SEO/하위호환 안전망 재현). ──
location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ @backend;
}
location @backend {
    proxy_pass http://ec_admin_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
