# application-dev.yml — 개발 서버(NAS dev 배포) 전용.
# DB 접속은 local 과 동일 기본값(공유 개발DB) 사용. CF_JWT_SECRET 은 dev NAS 의 .env 로 주입 —
# 여기 기본값을 안 둔 건 dev 컨테이너가 무심코 local 더미 시크릿으로 뜨는 걸 막기 위함.
spring:
  # datasource — 공통 application.yml 에 안 두고 프로파일마다 개별 선언(요청사항, EcBeBo 관례).
  # p6spy — local 과 동일(요청사항: "개발인 경우" 적용, prod 는 미적용). NAS 컨테이너 로그(docker
  # logs)에서도 SQL 이 바로 보여야 배포 후 문제 진단이 쉬워서 dev 도 포함.
  datasource:
    # DB_HOST=illeesam.synology.me | DB_PORT=17632 | DB_NAME=postgres | DB_SCHEMA=shopjoy_2604
    # DB_USERNAME=postgres
    # 2026-09-06(정책 준수: base.설정값암호화.md, EcBeBo 와 동일 조치) — password 는 이제 평문
    # 환경변수(DB_PASSWORD)가 아니라 Jasypt ENC(...) 값이다(EcBeBo 와 같은 마스터키 공유 — 같은
    # DB 라 굳이 앱별로 나눌 이유 없음). 실행 시 JASYPT_ENCRYPTOR_PASSWORD(마스터키) 환경변수만
    # 넘기면 부팅 시 자동 복호화된다. 값 재생성/확인은 apps/scripts_funcs/crypto/ 참조.
    url: jdbc:p6spy:postgresql://${DB_HOST:illeesam.synology.me}:${DB_PORT:17632}/${DB_NAME:postgres}?currentSchema=${DB_SCHEMA:shopjoy_2604}
    username: ${DB_USERNAME:postgres}
    password: ENC(AQkiKj/APEfU1zT7zSaO9HPJ+4XJO0uq9s8F7hWygavQs20pc+T/vlfxVcvQxJ6EvGgT6umnYY2l7jOXwTo49g==)
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver

server:
  port: 3000
  # 2026-09-06(EcBeBo 와 동일 이유) — DSM 리버스 프록시(TLS 종료) 뒤에서 redirect:/home/index.html
  # 같은 절대 리다이렉트가 스킴을 http:// 로 잘못 잡던 문제 — X-Forwarded-* 헤더 신뢰.
  forward-headers-strategy: framework

logging:
  level:
    com.shopjoy.ecBeCdn: INFO
    p6spy: OFF
  file:
    path: /app/logs
