<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ecBeCdn 운영</title>
<link rel="stylesheet" href="css/cf-admin.css">
</head>
<body>
<!-- EcCdnApi 관리자 화면 — shopjoy_v260406 의 bo.html 구조(상단헤더 + 좌측메뉴 + 우측콘텐츠,
     PAGE_COMP_MAP + <component :is> 라우팅)를 이 앱 규모(화면 4개)에 맞게 축소 재현했다.
     실제 페이지는 컴포넌트 파일(js/Cf*.js)로 분리 등록.
     2026-09-06: 로그인 없이 바로 사용(요청사항) — SecurityConfig 가 /api/cdn/** 를 permitAll 로 열어둠. -->
<div id="app">
  <div class="shell-header" style="position:relative;">
    <div class="brand">🛠️ ecBeCdn 운영<span class="sub">동영상·이미지·파일 CDN</span></div>
    <!-- 2026-09-06(요청사항: "ecBeBo, ecBeCdn 에서도 바로가기 링크 연결해줘") — FO/BO 의
         "메뉴 바로가기"/"연관사이트" 팝업과 동일한 NAS 배포 URL 표(포트/서브도메인/gateway). -->
    <button type="button" @click="deployLinksOpen = !deployLinksOpen"
      style="margin-left:auto;padding:6px 12px;font-size:12px;font-weight:600;background:#eef6ff;color:#1565c0;border:1px solid #d3e6fb;border-radius:6px;cursor:pointer;">
      🔗 배포 URL
    </button>
    <div v-if="deployLinksOpen" @click.self="deployLinksOpen = false"
      style="position:fixed;inset:0;z-index:998;background:rgba(0,0,0,0.25);"></div>
    <div v-if="deployLinksOpen"
      style="position:absolute;right:0;top:calc(100% + 8px);z-index:999;width:420px;max-width:90vw;background:#fff;border:1px solid #ddd;border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,0.18);padding:12px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #eee;">
        <span style="font-weight:800;font-size:13px;color:#1a1a2e;">🔗 NAS 배포 URL</span>
        <button @click="deployLinksOpen = false" style="background:none;border:none;font-size:13px;color:#888;cursor:pointer;">✕</button>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:11px;">
        <thead>
          <tr>
            <th style="text-align:left;padding:4px 6px;color:#999;font-weight:600;"></th>
            <th v-for="col in DEPLOY_COLS" :key="col.key" style="text-align:center;padding:4px 6px;color:#555;font-weight:700;">{{ col.label }}</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="row in DEPLOY_ROWS" :key="row.key">
            <td style="padding:4px 6px;color:#666;font-weight:600;white-space:nowrap;">{{ row.label }}</td>
            <td v-for="col in DEPLOY_COLS" :key="col.key" style="padding:3px 4px;text-align:center;">
              <button type="button" @click="window.open(DEPLOY_LINKS[col.key][row.key], '_blank')"
                :title="DEPLOY_LINKS[col.key][row.key]"
                style="width:100%;padding:5px 4px;font-size:11px;font-weight:600;background:#eef6ff;color:#1565c0;border:1px solid #d3e6fb;border-radius:5px;cursor:pointer;">
                열기
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="shell-sidebar">
    <div class="menu-group-label">관리</div>
    <a class="menu-item" :class="{ active: currentPage === 'file' }" @click="navigate('file')">📁 cf_file 관리</a>
    <a class="menu-item" :class="{ active: currentPage === 'fileList' }" @click="navigate('fileList')">🗂️ 파일 폴더뷰</a>
    <a class="menu-item" :class="{ active: currentPage === 'client' }" @click="navigate('client')">🔑 cf_client 관리</a>
    <a class="menu-item" :class="{ active: currentPage === 'authTest' }" @click="navigate('authTest')">🔐 인증 테스트</a>
    <div class="menu-group-label">운영</div>
    <a class="menu-item" :class="{ active: currentPage === 'logViewer' }" @click="navigate('logViewer')">🪵 로그뷰어</a>
    <a class="menu-item" :class="{ active: currentPage === 'config' }" @click="navigate('config')">⚙️ 설정정보</a>
    <a class="menu-item" :class="{ active: currentPage === 'redis' }" @click="navigate('redis')">🧰 Redis 모니터링</a>
    <a class="menu-item" :class="{ active: currentPage === 'dbTest' }" @click="navigate('dbTest')">🗄️ DB 연결 테스트</a>
  </div>
  <div class="shell-main">
    <!-- 열린 탭바(요청사항: "열린탭바도 있으면 좋겠는데") — 메인 프로젝트 bo.html 의 멀티탭
         감각을 이 앱 규모에 맞게 축소: 방문한 화면이 탭으로 남아 클릭 한 번에 전환, ✕ 로 닫기.
         전부 닫으면 첫 화면으로 자동 복귀(빈 화면 방지). -->
    <div class="open-tabs-bar">
      <div v-for="t in openTabs" :key="t.id" class="open-tab" :class="{ active: currentPage === t.id }" @click="navigate(t.id)">
        {{ t.label }}
        <span class="tab-close" @click.stop="onCloseTab(t.id)">✕</span>
      </div>
    </div>
    <cf-file-mng v-if="currentPage === 'file'"></cf-file-mng>
    <cf-file-file-list v-else-if="currentPage === 'fileList'"></cf-file-file-list>
    <cf-client-mng v-else-if="currentPage === 'client'"></cf-client-mng>
    <cf-auth-test v-else-if="currentPage === 'authTest'"></cf-auth-test>
    <cf-log-viewer v-else-if="currentPage === 'logViewer'"></cf-log-viewer>
    <cf-config-viewer v-else-if="currentPage === 'config'"></cf-config-viewer>
    <cf-redis-monitor v-else-if="currentPage === 'redis'"></cf-redis-monitor>
    <cf-db-test v-else-if="currentPage === 'dbTest'"></cf-db-test>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<!-- js/utils: 공용 유틸(fetch래퍼/토스트) · js/comp: 재사용 컴포넌트(BoGrid 등) · js/pages: 화면(페이지) 컴포넌트 -->
<script src="js/utils/cfAuth.js"></script>
<script src="js/comp/BoLite.js"></script>
<script src="js/pages/CfClientMng.js"></script>
<script src="js/pages/CfFileMng.js"></script>
<script src="js/pages/CfFileFileList.js"></script>
<script src="js/pages/CfAuthTest.js"></script>
<script src="js/pages/CfLogViewer.js"></script>
<script src="js/pages/CfConfigViewer.js"></script>
<script src="js/pages/CfRedisMonitor.js"></script>
<script src="js/pages/CfDbTest.js"></script>
<script>
const { createApp, ref, reactive } = Vue;

// ?page=client|file|fileList|authTest|logViewer|config|redis|dbTest 로 직접 진입 가능(북마크 편의) — 기본은 cf_file.
const initialPage = new URLSearchParams(location.search).get('page');
const VALID_PAGES = ['file', 'fileList', 'client', 'authTest', 'logViewer', 'config', 'redis', 'dbTest'];
const PAGE_LABELS = {
  file: '📁 cf_file 관리', fileList: '🗂️ 파일 폴더뷰', client: '🔑 cf_client 관리', authTest: '🔐 인증 테스트',
  logViewer: '🪵 로그뷰어', config: '⚙️ 설정정보', redis: '🧰 Redis 모니터링', dbTest: '🗄️ DB 연결 테스트',
};

// 2026-09-06(요청사항: "ecBeBo, ecBeCdn 에서도 바로가기 링크 연결해줘") — FO/BO 쪽과 동일한
// NAS 배포 URL 표(포트/서브도메인/gateway). URL 은 전부 실측 확인(curl 200) 완료.
const NAS_HOST = 'illeesam.synology.me';
// 2026-09-06(요청사항: "/index.html 생략" + "ecBeBo/ecBeCdn 자동인식") — StaticIndexRedirectController
// 추가 + 게이트웨이 헤더 수정으로 index.html 없이도 정상 동작(실측 200 확인).
const DEPLOY_LINKS = {
  fo:      { port: `http://${NAS_HOST}:22000`,          sub: `https://22000.${NAS_HOST}`,          gw: `http://${NAS_HOST}:22099` },
  bo:      { port: `http://${NAS_HOST}:22000/bo.html`,  sub: `https://22000.${NAS_HOST}/bo.html`,  gw: `http://${NAS_HOST}:22099/bo.html` },
  ecBeBo:  { port: `http://${NAS_HOST}:22300/home`,     sub: `https://22300.${NAS_HOST}/home`,     gw: `http://${NAS_HOST}:22099/admin-tools` },
  ecBeCdn: { port: `http://${NAS_HOST}:22400/home`,     sub: `https://22400.${NAS_HOST}/home`,     gw: `http://${NAS_HOST}:22099/cdn-admin` },
};
const DEPLOY_COLS = [
  { key: 'fo', label: 'FO' }, { key: 'bo', label: 'BO' },
  { key: 'ecBeBo', label: 'ecBeBo' }, { key: 'ecBeCdn', label: 'ecBeCdn' },
];
const DEPLOY_ROWS = [
  { key: 'port', label: '포트' }, { key: 'sub', label: '서브도메인' }, { key: 'gw', label: 'gateway' },
];

const app = createApp({
  setup() {
    const deployLinksOpen = ref(false);
    const startPage = VALID_PAGES.includes(initialPage) ? initialPage : 'file';
    const currentPage = ref(startPage);
    // 열린 탭바(요청사항: "열린탭바도 있으면 좋겠는데") — 방문한 화면을 탭으로 유지.
    const openTabs = reactive([{ id: startPage, label: PAGE_LABELS[startPage] }]);
    // 요청사항(2026-09-06): "상단 URL 이 ?page=... 로 표시되어야 하고, 새로고침해도 그 화면
    // 그대로 보여야 한다" — 메뉴 클릭 시 currentPage 만 바꾸고 URL 은 그대로 두던 방식(예전)은
    // 새로고침하면 항상 기본 페이지(file)로 돌아갔다. history.replaceState 로 주소창의 ?page=
    // 쿼리를 화면 전환마다 같이 갱신해서(새 히스토리 항목은 안 쌓음 — 뒤로가기 스팸 방지),
    // 북마크·새로고침·주소 복사 어디서든 같은 화면으로 복귀되게 한다.
    const navigate = (page) => {
      currentPage.value = page;
      if (!openTabs.some((t) => t.id === page)) openTabs.push({ id: page, label: PAGE_LABELS[page] });
      const url = new URL(location.href);
      url.searchParams.set('page', page);
      history.replaceState(null, '', url);
    };
    // 탭 닫기 — 닫은 게 현재 보고 있던 탭이면 그 옆 탭(없으면 남은 첫 탭)으로 전환, 전부
    // 닫혔으면 기본 화면을 다시 연다(빈 화면 방지).
    const onCloseTab = (id) => {
      const idx = openTabs.findIndex((t) => t.id === id);
      if (idx === -1) return;
      openTabs.splice(idx, 1);
      if (currentPage.value !== id) return;
      if (openTabs.length === 0) { navigate('file'); return; }
      const nextTab = openTabs[idx] || openTabs[idx - 1];
      navigate(nextTab.id);
    };
    return { currentPage, openTabs, navigate, onCloseTab, deployLinksOpen, DEPLOY_LINKS, DEPLOY_COLS, DEPLOY_ROWS };
  },
});
// BoLite.js(경량 로컬 포트) — 메인 프로젝트 bo-grid/bo-grid-crud/bo-form-area 의 columns 속성화
// 계약을 따르는 EcCdnApi 전용 구현. CfAuthTest/CfClientMng/CfFileMng/CfDbTest 가 사용.
app.component('BoGrid', window.BoGrid);
app.component('BoFormArea', window.BoFormArea);
app.component('BoGridCrud', window.BoGridCrud);
app.component('BoPager', window.BoPager);
app.component('BoPage', window.BoPage);
app.component('BoContainer', window.BoContainer);
app.component('CfClientMng', window.CfClientMng);
app.component('CfFileMng', window.CfFileMng);
app.component('CfFileFileList', window.CfFileFileList);
app.component('CfAuthTest', window.CfAuthTest);
app.component('CfLogViewer', window.CfLogViewer);
app.component('CfConfigViewer', window.CfConfigViewer);
app.component('CfRedisMonitor', window.CfRedisMonitor);
app.component('CfDbTest', window.CfDbTest);
app.mount('#app');
</script>
</body>
</html>
