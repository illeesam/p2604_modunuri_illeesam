events {
    worker_connections 1024;
}

http {
    # 2026-09-02 추가: mime.types 를 안 불러오면 nginx가 확장자별 Content-Type을 못 정해서
    # 전부 default_type(문서 없으면 기본값 text/plain)으로 나간다 — CSS가 text/plain으로
    # 나가면 요즘 브라우저는 스타일시트 적용 자체를 거부한다(strict MIME 체크). 파일은 200으로
    # 정상 전송되는데 화면 스타일만 하나도 안 먹는 증상으로 나타남(실측 확인).
    # mime.types 는 nginx 공식 이미지 안에 기본 내장(/etc/nginx/mime.types) — 상대경로로 바로 참조 가능.
    include       mime.types;
    default_type  application/octet-stream;

    # ═══════════════════════════════════════════════════════════════════════
    #  2026-09-06 대개편 — "4개 앱(ecBeBo/ecBeCdn/ecFeBo/ecBeRedis)이 각자 다른 호스팅사에
    #  흩어질 수도 있다"는 최악의 경우를 기준으로 완전 분리 설계로 전환.
    #
    #  이전엔 이 nginx가 upstream ec_admin_api/ec_cdn_api 로 /api,/cf,/cdn-admin,/admin-tools 등을
    #  전부 리버스프록시해서 "프론트+백엔드+CDN이 한 origin 인 것처럼" 보이게 했다 — 이 방식은
    #  세 서비스가 반드시 같은 Docker 네트워크(shopjoy-net)에 같이 떠 있어야만 동작해서, 각자
    #  다른 호스팅사로 갈 수 있다는 전제와 정면으로 충돌한다.
    #
    #  그래서 이 nginx(ecFeBo)는 이제 **정적 파일(FO/BO 빌드 산출물)만 서빙**한다. 백엔드/CDN은
    #  프론트 JS 코드가 절대 URL(각자의 공개 도메인)로 직접 호출한다 — CORS 로 방어
    #  (CorsOriginPolicy.java 의 "*.illeesam.synology.me" 패턴이 이미 이를 지원). 실제 호출 대상
    #  주소는 apps/ecFeBo/lib/env/profiles/{bo,fo}EnvConsts.dev.js 의 baseApiHost/cdnApiHost 참조.
    #
    #  upstream/proxy_pass 블록이 통째로 사라졌다 — 백엔드(ecBeBo)/CDN(ecBeCdn) 컨테이너가
    #  이 NAS에 없어도(또는 아예 다른 서버에 있어도) 이 nginx는 정적 파일 서빙만으로 완결된다.
    # ═══════════════════════════════════════════════════════════════════════

    # ═══════════════════════════════════════════════════════════════════════
    #  gzip 압축 — 2026-08-30 추가
    #  FO/BO 프론트가 빌드 없이 원본 JS(340개+)를 그대로 서빙하므로, 압축이 없으면
    #  전송량이 그대로 낭비된다. 텍스트 계열만 압축(이미 압축된 png/jpg/woff2 등은 제외 —
    #  다시 압축해봐야 이득 없이 CPU만 씀).
    # ═══════════════════════════════════════════════════════════════════════
    gzip on;
    gzip_vary on;                 # Vary: Accept-Encoding — 프록시/CDN 캐시가 압축 유무로 응답을 구분하게 함
    gzip_min_length 1024;         # 1KB 미만은 압축 오버헤드가 더 커서 제외
    gzip_comp_level 6;            # 압축률/CPU 절충 (1~9, nginx 기본 권장값)
    gzip_types
        text/plain text/css text/javascript text/xml
        application/javascript application/json application/xml
        image/svg+xml;

    # ═══════════════════════════════════════════════════════════════════════
    #  HTTPS 활성화 방법 (2026-08-30 추가, 기본은 비활성 — 아래 [443 블록]이 통째로 주석 처리돼
    #  있어서 지금 이 파일을 그대로 배포해도 기존 HTTP-only 동작이 안 바뀐다):
    #   1) 도메인이 이 서버를 가리키도록 DNS 설정
    #   2) certbot 으로 인증서 최초 발급(예: standalone 모드 — nginx 잠깐 내리고):
    #        docker compose stop nginx
    #        docker run --rm -p 80:80 -v /volume1/docker/shopjoy/certs:/etc/letsencrypt \
    #          certbot/certbot certonly --standalone -d your-domain.com
    #        docker compose start nginx
    #      (webroot 모드로 무중단 발급하려면 아래 acme-challenge location 을 먼저 살려두고
    #      --webroot --webroot-path=/usr/share/nginx/html 로 발급)
    #   3) 아래 [443 블록]의 주석(#)을 전부 제거하고, ssl_certificate 경로를 실제 도메인명으로 수정
    #   4) 80 블록 맨 아래의 "return 301 https://..." 줄 주석 해제(HTTP→HTTPS 강제 리다이렉트)
    #   5) docker-compose.yml 에 인증서 볼륨마운트 추가(주석 참조) 후 docker compose up -d --force-recreate nginx
    #   6) docker compose exec nginx nginx -t 로 문법 확인 후 필요시 nginx -s reload
    #  인증서는 90일마다 갱신 필요 — certbot renew 를 cron/스케줄러에 등록해둘 것.
    #  (이 NAS는 DSM 리버스 프록시 서브도메인 방식(22000.illeesam.synology.me 등)으로 HTTPS를
    #  이미 확보하고 있어 이 컨테이너 자체 인증서는 필수가 아니다 — 다른 호스팅사로 옮길 때 참조.)
    # ═══════════════════════════════════════════════════════════════════════

    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;
        include /etc/nginx/security-headers.conf;

        # certbot webroot 방식 갱신용 — HTTPS 활성화 후에도 이 location 만은 리다이렉트 예외로
        # 남겨둬야 인증서 자동 갱신이 계속 동작한다(80번 포트로 오는 이 경로만은 리다이렉트 전에
        # 먼저 매치돼야 하므로 아래 return 301 보다 위에 있어야 함).
        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
        }

        # HTTPS 활성화 시 이 줄의 주석을 해제 — 그 전까지는 지금처럼 80번이 그대로 서빙한다.
        # return 301 https://$host$request_uri;

        include /etc/nginx/locations.conf;
    }

    # ═══════════════════════════════════════════════════════════════════════
    #  [443 블록] HTTPS — 기본 비활성(전부 주석). 활성화 절차는 위쪽 안내 참조.
    #  아래 주석(#)을 전부 지우고 ssl_certificate 경로 2줄을 실제 도메인으로 바꿔서 쓴다.
    # ═══════════════════════════════════════════════════════════════════════
    # server {
    #     listen 443 ssl;
    #     http2 on;                          # nginx 1.25.1+ 문법(그 이전 버전은 "listen 443 ssl http2;" 로 합쳐 쓸 것)
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;      # 구버전 TLS(1.0/1.1) 비활성 — 알려진 취약점 회피
    #     ssl_prefer_server_ciphers off;      # TLS 1.3 기준 권장(클라이언트가 고른 암호군 그대로 사용)
    #
    #     client_max_body_size 50M;
    #     include /etc/nginx/security-headers.conf;
    #     # HSTS — HTTPS 로 몇 주 이상 안정적으로 운영되는 걸 확인한 뒤 켤 것(먼저 켜면
    #     # 인증서 문제 발생 시 브라우저가 HTTP 폴백조차 거부해서 접속 자체가 막힐 수 있음).
    #     # add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    #
    #     include /etc/nginx/locations.conf;
    # }
}
