# locations.conf — 2026-08-30 분리, 2026-09-06 정적 전용으로 대개편.
# HTTP(80)/HTTPS(443) 두 server 블록이 이 파일 하나를 include 해서 공유한다 — HTTPS 활성화
# 하겠다고 이 규칙들을 통째로 복사해서 두 벌 관리하면 나중에 한쪽만 고치고 잊어버리는 사고가
# 나기 쉬워서, 애초에 파일을 하나로 묶어 양쪽이 항상 같은 규칙을 쓰도록 한다.
#
# 2026-09-06: "4개 앱이 각자 다른 호스팅사로 갈 수도 있다"는 최악의 경우 기준으로 설계 변경 —
# 이 파일에 있던 /api,/foui,/cdn,/api/cdn,/api/auth,/cdn-admin,/admin-tools,/cf,@backend 등
# 백엔드(ecBeBo)/CDN(ecBeCdn) 리버스프록시 규칙을 전부 제거했다. 그 서비스들은 이제
# nginx(이 컨테이너)와 같은 호스트에 있을 필요가 없다 — 프론트 JS 코드가 각자의 절대
# URL(baseApiHost/cdnApiHost, apps/ecFeBo/lib/env/profiles/*.dev.js)로 직접 호출하고
# CORS(CorsOriginPolicy.java)로 방어한다. 남은 건 순수 정적 파일 서빙 규칙뿐이다.
#
# ⚠ 백엔드가 예전처럼 이 nginx와 정말 같은 NAS 에 있고, 같은 origin 으로 노출하고 싶다면
#   (CORS 없이 상대경로 API 호출) — 그건 이제 이 파일이 아니라 apps/ecBeBo/docker-compose.yml
#   쪽에 별도 게이트웨이를 두는 선택지다(각 앱의 완전 독립을 우선한 설계라 기본 제공하지 않음).

# ── ① CDN 로컬 패키지(assets/cdn/pkg/<lib>/<버전>/...) — 경로 자체에 버전이
#    박혀있어 내용이 절대 안 바뀐다(버전 올리면 경로가 바뀜) → 1년 캐시 + immutable 안전.
#    반드시 아래 ③(app.js) 규칙보다 먼저 와야 한다 — nginx location 은 더 긴/구체적인
#    prefix 가 먼저 매치되지만, 정규식(~)끼리는 "먼저 선언된 것"이 우선이라 순서 중요. ──
location ~* ^/assets/cdn/pkg/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# ── ② 이미지/폰트류 — 버전 경로가 없어 무한 캐시는 위험하지만, 자주 안 바뀌므로
#    적당히 길게(7일). 배포로 이미지가 바뀌면 최대 7일간 구버전이 보일 수 있음을
#    감안한 값 — 더 짧게 원하면 낮추면 됨. ──
location ~* \.(png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot)$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=604800" always;
}

# ── ③ 앱 소스(JS/CSS/HTML) — 버전 해시가 없는 "빌드 없음" 구조라 오래 캐시하면
#    배포 직후에도 브라우저가 구버전 JS를 계속 쓰는 사고가 난다. no-cache 는
#    "저장은 하되 매번 서버에 물어보고 써라"(304 면 재전송 없음, ETag/Last-Modified 는
#    nginx 정적 서빙이 자동으로 붙여준다) — 캐시 자체를 끄는 no-store 와 다르다. ──
location ~* \.(js|css|html)$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache" always;
}

# ── ④ 그 외 전부(루트 index.html/bo.html, favicon 등 확장자 없는 요청) — 정적 루트에서
#    직접 서빙. 2026-09-06: 백엔드 폴백(@backend)이 사라졌으므로 못 찾으면 그냥 404 —
#    이 프론트는 해시 기반 라우팅(#page=xxx)이라 실제 경로는 index.html/bo.html 두 개뿐이고,
#    그 외 경로 딥링크를 서버가 대신 처리해줄 필요가 원래 없다.
#    try_files 에 $uri 만 있으면 "/"(디렉터리)는 "파일 아님"으로 바로 실패하므로 $uri/ 를
#    추가해야 디렉터리로 인식해 index 지시어(index.html)가 실제로 적용된다. ──
location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ =404;
}
