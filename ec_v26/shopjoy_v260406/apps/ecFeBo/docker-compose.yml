# ═══════════════════════════════════════════════════════════
#  ShopJoy Frontend (FO/BO 정적 파일 서빙) - Docker Compose
# ═══════════════════════════════════════════════════════════
#  배치 위치: apps/ecFeBo/docker-compose.yml
#  실행 명령: docker compose up -d   (이미지만 pull — 빌드 대상 없음, 공식 nginx 이미지 그대로 사용)
#
#  2026-09-06 신설 — 지금까지 이 nginx는 apps/ecBeBo/docker-compose.yml 안에 얹혀서 백엔드와
#  같은 스택으로 떴다(정적 파일 서빙 + /api,/cf 리버스프록시 겸용). "4개 앱(ecBeBo/ecBeCdn/
#  ecFeBo/ecBeRedis)이 각자 다른 호스팅사에 흩어질 수도 있다"는 최악의 경우를 기준으로
#  설계를 바꾸면서, 이 nginx를 완전히 독립된 컨테이너/스택으로 분리했다.
#
#  변경 후 이 컨테이너는 **정적 파일만 서빙**한다(리버스프록시 전부 제거 — nginx.conf/
#  locations.conf 상단 주석 참조). 백엔드(ecBeBo)/CDN(ecBeCdn)이 이 NAS에 같이 없어도,
#  심지어 존재하지 않아도 이 컨테이너 자체는 완결되어 뜬다.
#
#  ⚠️ 정적 파일 배포 폴더(/volume1/docker/shopjoy/apps/ecFeBo)와 이 compose/설정 파일이 있는
#     폴더(/volume1/docker/shopjoy/apps/ecFeBoApp)를 반드시 분리해야 한다 — FE 배포 스크립트
#     (deploy-dev-synol-fe-ecFeBo.js, apps/scripts_deploy_illeesam_synol/deploy/ 에서
#     npm run ecFeBo)가 매 배포마다
#     ecFeBo 폴더를 통째로 rm -rf 후 dist/ 로 재생성하기 때문에, 같은 폴더에 두면 이
#     docker-compose.yml 자체가 다음 프론트 배포 때 지워진다.
# ═══════════════════════════════════════════════════════════

services:
  ecfebo:
    image: nginx:1.27-alpine
    container_name: shopjoy-ecFeBo-22000

    # ───── 포트 매핑 ─────
    # 2026-09-06: 21000 → 22000 (컨테이너 이름 규칙 shopjoy-{앱}-{포트} 통일에 맞춰 포트도 재번호).
    # DSM 리버스 프록시로 22000.illeesam.synology.me(HTTPS) 서브도메인을 이 포트로 연결해야
    # 브라우저의 secure-context 요구(crypto.subtle 등)를 만족한다 — DSM 콘솔에서 수동 등록 필요
    # (기존 21000.illeesam.synology.me 등록과 동일한 방식, CorsOriginPolicy.java 의
    # "*.illeesam.synology.me" 패턴이 이미 신규 서브도메인도 자동으로 허용한다).
    ports:
      - "22000:80"

    # ───── 볼륨 마운트 ─────
    # nginx.conf/locations.conf/security-headers.conf: 이 compose 파일과 같은 디렉터리
    #   (/volume1/docker/shopjoy/apps/ecFeBoApp/) — 3개 다 같은 곳에 있어야 nginx.conf 의
    #   include 상대참조가 맞음.
    # html: FO/BO 빌드 산출물 루트(dist/, npm run build 로 생성 — bo.html/index.html 이 있는
    #   폴더) — /volume1/docker/shopjoy/apps/ecFeBo 를 그대로 참조(위 배포 폴더 분리 설명 참조).
    #   deploy-dev-synol-fe-ecFeBo.js(deploy/ 에서 npm run ecFeBo)로 배포할 때마다 채워진다.
    # 2026-09-06 재구조화(요청사항: "shopjoy 아래 혼재돼 있던 폴더를 apps/storage/data/logs
    # 로 분류") — 둘 다 apps/ 아래로 이동.
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./locations.conf:/etc/nginx/locations.conf:ro
      - ./security-headers.conf:/etc/nginx/security-headers.conf:ro
      - /volume1/docker/shopjoy/apps/ecFeBo:/usr/share/nginx/html:ro
      # HTTPS 활성화 시(nginx.conf [443 블록] 주석 해제와 함께) 아래 볼륨도 추가할 것 —
      # certbot 이 발급한 인증서를 컨테이너 안 /etc/letsencrypt 경로로 읽기 전용 마운트.
      # (이 NAS는 DSM 리버스 프록시 서브도메인 방식으로 HTTPS를 이미 확보하고 있어 필수는 아님)
      # - /volume1/docker/shopjoy/certs:/etc/letsencrypt:ro

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

# 2026-09-06: shopjoy-net 공유 네트워크에 더 이상 join 하지 않는다 — 백엔드/CDN을 Docker
# 내부 DNS 이름(ecbebo/eccdnapi)으로 부르는 리버스프록시가 사라졌으므로 이 컨테이너는
# 다른 컨테이너와 네트워크를 공유할 이유가 전혀 없다(완전 독립). 별도 networks: 블록
# 없이 compose 기본 네트워크만 사용.
