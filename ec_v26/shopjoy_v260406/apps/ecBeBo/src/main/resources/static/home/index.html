<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcAdminApi 운영 도구</title>
<link rel="stylesheet" href="css/log-admin.css">
</head>
<body>
<!-- EcAdminApi 운영 화면(로그뷰어 등) — EcCdnApi 의 static/index.html 구조(상단헤더 + 좌측메뉴 +
     우측콘텐츠, <component> 라우팅)를 그대로 참고해 이식했다(요청사항: "EcCdnApi 프로그램
     참고해줘"). EcAdminApi 의 실제 BO/FO 화면은 프로젝트 루트의 bo.html/index.html 이고, 여기는
     그것과 완전히 별개인 "운영 도구" 전용 화면이다.
     2026-09-06: 로그인 없이 바로 사용(요청사항: "인증없이 누구나 보는거야") — SecurityConfig 가
     /api/co/** 및 정적 리소스(/, /*.html, /css/**, /js/**)를 permitAll 로 열어둠. -->
<div id="app">
  <div class="shell-header">
    <div class="brand">🛠️ EcAdminApi 운영 도구<span class="sub">로그뷰어 등</span></div>
  </div>
  <div class="shell-sidebar">
    <div class="menu-group-label">운영</div>
    <a class="menu-item" :class="{ active: currentPage === 'logViewer' }" @click="navigate('logViewer')">🪵 로그뷰어</a>
  </div>
  <div class="shell-main">
    <!-- 열린 탭바(요청사항: "열린탭바도 있으면 좋겠는데") — EcCdnApi 의 index.html 과 동일 패턴.
         현재는 화면 1개뿐이라 탭 1개로 시작하지만, 앞으로 화면이 늘어도 그대로 확장된다. -->
    <div class="open-tabs-bar">
      <div v-for="t in openTabs" :key="t.id" class="open-tab" :class="{ active: currentPage === t.id }" @click="navigate(t.id)">
        {{ t.label }}
        <span class="tab-close" @click.stop="onCloseTab(t.id)">✕</span>
      </div>
    </div>
    <log-viewer v-if="currentPage === 'logViewer'"></log-viewer>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<!-- js/utils: 공용 유틸(fetch래퍼/토스트) · js/comp: 재사용 컴포넌트(BoGrid 등) · js/pages: 화면(페이지) 컴포넌트 -->
<script src="js/utils/logAuth.js"></script>
<script src="js/comp/BoLite.js"></script>
<script src="js/pages/LogViewer.js"></script>
<script>
const { createApp, ref, reactive } = Vue;

// ?page=logViewer 로 직접 진입 가능(북마크 편의) — 기본은 logViewer(현재 화면이 1개뿐).
const initialPage = new URLSearchParams(location.search).get('page');
const VALID_PAGES = ['logViewer'];
const PAGE_LABELS = { logViewer: '🪵 로그뷰어' };

const app = createApp({
  setup() {
    const startPage = VALID_PAGES.includes(initialPage) ? initialPage : 'logViewer';
    const currentPage = ref(startPage);
    // 열린 탭바(요청사항) — 방문한 화면을 탭으로 유지.
    const openTabs = reactive([{ id: startPage, label: PAGE_LABELS[startPage] }]);
    // 요청사항(2026-09-06): "상단 URL 이 ?page=... 로 표시되어야 하고, 새로고침해도 그 화면
    // 그대로 보여야 한다" — history.replaceState 로 주소창의 ?page= 쿼리를 화면 전환마다
    // 같이 갱신해서(새 히스토리 항목은 안 쌓음) 새로고침·북마크 어디서든 같은 화면으로 복귀.
    const navigate = (page) => {
      currentPage.value = page;
      if (!openTabs.some((t) => t.id === page)) openTabs.push({ id: page, label: PAGE_LABELS[page] });
      const url = new URL(location.href);
      url.searchParams.set('page', page);
      history.replaceState(null, '', url);
    };
    const onCloseTab = (id) => {
      const idx = openTabs.findIndex((t) => t.id === id);
      if (idx === -1) return;
      openTabs.splice(idx, 1);
      if (currentPage.value !== id) return;
      if (openTabs.length === 0) { navigate('logViewer'); return; }
      const nextTab = openTabs[idx] || openTabs[idx - 1];
      navigate(nextTab.id);
    };
    return { currentPage, openTabs, navigate, onCloseTab };
  },
});
// BoLite.js(경량 로컬 포트) — 메인 프로젝트 bo-grid/bo-page/bo-container 의 columns 속성화
// 계약을 따르는 이 운영 도구 전용 구현. LogViewer 가 사용(요청사항: "<bo-grid <bo-form <bo-page
// 이런거 최대한 활용해줘").
app.component('BoGrid', window.BoGrid);
app.component('BoFormArea', window.BoFormArea);
app.component('BoGridCrud', window.BoGridCrud);
app.component('BoPager', window.BoPager);
app.component('BoPage', window.BoPage);
app.component('BoContainer', window.BoContainer);
app.component('LogViewer', window.LogViewer);
app.mount('#app');
</script>
</body>
</html>
