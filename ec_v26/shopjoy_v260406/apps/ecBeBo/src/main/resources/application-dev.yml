spring:
  # 서버 환경 — DevTools hot-reload 무의미 + 변경 감지 사이드이펙트만 발생. 비활성.
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  datasource:
    # DB_HOST=illeesam.synology.me | DB_PORT=17632 | DB_NAME=postgres | DB_SCHEMA=shopjoy_2604
    # DB_USERNAME=postgres | DB_PASSWORD=(환경변수 필수)
    url: jdbc:p6spy:postgresql://${DB_HOST:illeesam.synology.me}:${DB_PORT:17632}/${DB_NAME:postgres}?currentSchema=${DB_SCHEMA:shopjoy_2604}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgresilleesam}
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
      connection-test-query: "SELECT 1"

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect   # HHH90000025 경고 방지 위해 properties.hibernate.dialect 대신 사용
    properties:
      hibernate:
        default_schema: shopjoy_2604
        format_sql: true
        use_sql_comments: true
    open-in-view: false

  sql:
    init:
      mode: never

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  # ── 메일(SMTP) — host/port/username/password 는 sy_prop(spring.mail.*) 에서 주입 ──
  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  config-location: classpath:mybatis/mybatis-config.xml
  type-aliases-package: com.shopjoy.ecadminapi

server:
  port: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      # 2026-09-06: true 로 바꾸면 Spring Boot 자체 내장 RedisHealthIndicator 가 켜지는데, 이건
      # 이 프로젝트의 app.redis.*(RedisConfig/RedisProperties, primaryRedisTemplate) 를 전혀 안 보고
      # 스프링 부트 자체 자동설정(spring.data.redis.* — 우리가 안 씀, 기본값 localhost:6379)으로
      # 별도 연결을 새로 만든다 — 실제로 이것 때문에 컨테이너가 "localhost:6379 연결거부"로 헬스체크
      # 실패(unhealthy)를 겪었다(2026-09-06). Redis 상태 확인은 CacheRedisInfoController(/api/co/cache/redis/status)
      # 가 이미 app.redis.* 기준으로 정확히 제공하므로, 여기는 계속 false 로 둔다.
      enabled: false

app:
  auth:
    jwt:
      secret: ${JWT_SECRET:c2hvcGpveTI2MDRBZG1pbkFwaVNlY3JldEtleU11c3RCZTE2MEJpdHNNaW5pbXVt}
      bo-access-expiry: ${JWT_BO_ACCESS_EXPIRY:900000}      # 15분 accessToken 만료
      fo-access-expiry: ${JWT_FO_ACCESS_EXPIRY:900000}      # 15분 accessToken 만료
      bo-refresh-expiry: ${JWT_BO_REFRESH_EXPIRY:7200000}   # BO 관리자 refreshToken: 2시간 (Sliding)
      fo-refresh-expiry: ${JWT_FO_REFRESH_EXPIRY:1296000000} # FO 회원 refreshToken: 15일 (Sliding)

  # app.mail.from / from-nm 은 sy_prop(app.mail.*) 에서 주입
  # app.license.secret / enabled 는 sy_prop(app.license.*) 에서 주입
  license:
    output-dir: ${LICENSE_OUTPUT_DIR:./_license-output}

  # FoSeoController/FoSeoService — SEO 메타태그 서버사이드 주입(/prodDtl/{prodId}) 용 (application-local.yml 참조)
  frontend:
    dir: ${FRONTEND_DIR:../../}
    base-url: ${FRONTEND_BASE_URL:http://127.0.0.1:5501}

  redis:
    # 2026-09-06: apps/ecBeRedis/docker-compose.yml(shopjoy-ecBeRedis-22379, 비밀번호 있음)가
    # 정식 관리 대상 — 옛 DSM 직접생성 컨테이너(123-redis.70rc1, 12379, 무암호)는 포트가 달라
    # 병행 운영 가능하나 대체 대상이다. host 기본값이 illeesam.synology.me(공인 DDNS)인 이유는
    # DB_HOST 와 동일 — 이 PC에서 직접 bootRun 할 때 외부에서 붙을 수 있게. NAS 컨테이너 안에서
    # 이 앱이 뜰 때는(docker-compose) 자기 자신으로 되돌아오는 NAT 헤어핀을 피하려고 .env 에서
    # REDIS_HOST=host.docker.internal 로 오버라이드한다(DB_HOST 와 같은 이유). 비밀번호가 걸린
    # Redis 이므로 REDIS_PASSWORD 도 .env 에 반드시 맞춰 넣을 것(apps/ecBeRedis/.env 와 동일 값).
    enabled: ${REDIS_ENABLED:false}
    primary:
      host: ${REDIS_HOST:illeesam.synology.me}
      port: ${REDIS_PORT:22379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000
    # secondary:              # 보조 Redis 노드 (미설정 시 primary fallback)
    #   host: localhost
    #   port: 6380
    #   password: ""
    #   database: 0
    ttl:
      # auth: JWT access-expiry(900s)와 동일
      bo-auth-seconds: 900            # BO 관리자 세션  | 15분
      fo-auth-seconds: 900            # FO 회원 세션    | 15분
      ext-auth-seconds: 900           # EXT 외부 세션   | 15분
      # sy-*: 변경 시 evict() 호출로 즉시 반영 → TTL은 안전망
      sy-code-seconds: 3600           # 공통코드        | 1시간
      sy-menu-seconds: 3600           # 메뉴 구조       | 1시간
      sy-role-seconds: 3600           # 역할 정보       | 1시간
      sy-role-menu-seconds: 3600      # 역할-메뉴 매핑  | 1시간
      sy-prop-seconds: 3600           # 시스템 프로퍼티 | 1시간
      sy-i18n-seconds: 3600           # 다국어 메시지   | 1시간
      # ec-*: 변경 시 evict() 호출 전제, 3600으로 통일
      ec-pd-prod-seconds: 3600        # 상품 정보           | 1시간
      ec-pd-cate-seconds: 3600        # 카테고리 정보       | 1시간
      ec-pd-cate-prod-seconds: 3600   # 카테고리 상품 정보  | 1시간
      ec-pm-prom-seconds: 3600        # 프로모션 정보       | 1시간
      ec-pm-prom-item-seconds: 3600   # 프로모션 항목 정보  | 1시간
      ec-dp-disp-seconds: 3600        # 전시 정보           | 1시간
      ec-dp-disp-item-seconds: 3600   # 전시 항목 정보      | 1시간
  scheduler:
    enabled: true           # 배치 스케줄러 활성 여부. false=앱 기동 시 cron 등록 생략
    jenkins:
      enabled: false        # Jenkins 외부 호출 모드. true=cron 생략, Jenkins가 직접 API 호출
                            # POST /api/sch/jenkins/{batchCode} + Header X-Jenkins-Token
      token: ${JENKINS_TOKEN:dev-batch-jenkins-tk-9f2a4c8e1b7d}   # 환경변수 우선, 미설정 시 기본값 사용
      url: ""               # 앱→Jenkins 역방향 트리거 URL (미사용, 향후 연동 예정)
    allowed-ips: "*"        # 스케줄 관리 API 허용 IP. "*"=전체허용 | "IP1^IP2"=화이트리스트
  error-log:
    db-save: true
    queue-size: 100
  access-log:
    db-save: true
    queue-size: 100
    filter: "BO^FO^EXT"       # *=전체 | BO=관리자 | BO^FO^EXT | userId^BO
    max-body-size: 2000

  # ── 파일 업로드 설정 (dev 프로파일) ─────────────────────────────────
  # storage-type / cdn-host / aws.* / ncp.* 는 sy_prop(app.file.*) 에서 주입
  file:
    allowed-extensions: jpg,jpeg,png,gif,webp,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,zip,mp4,avi,mov,mkv,webm,flv,wmv,m4v
    max-file-size: 10485760
    max-request-size: 52428800
    max-image-size: 5242880
    max-document-size: 20971520
    max-video-size: 104857600
    local:
      base-path: static/cdn
      upload-dir: uploads
    thumbnail-enabled: true
    thumbnail-sizes: 200x200,400x400,800x800

# ────────────────────────────────────────────
# 로깅 — dev 프로파일
#   레벨   : DEBUG (logback-spring.xml <springProfile name="local,dev"> 적용)
#   콘솔   : 컬러 + (%파일:%라인) IntelliJ 클릭 링크 → 소스 바로 이동
#   파일   : logs/ecadminapi.log  (50MB 롤링·30일·2GB·gzip)
#   에러   : logs/ecadminapi-error.log (20MB 롤링·90일·500MB·gzip)
#   시작 시: logback statusListener 가 파일 경로를 콘솔에 출력
# ────────────────────────────────────────────
logging:
  file:
    # 2026-09-06 버그수정: 여기 있던 C:/_logs/shopjoy 는 local(윈도우 직접 실행) 전용 경로가
    # 실수로 dev 에도 복사돼 있던 것 — dev 는 Linux Docker 컨테이너라 그 경로로는 로그 파일이
    # 전혀 안 만들어지고 있었다(docker exec 로 확인: /app/logs 자체가 없었음). docker-compose.yml
    # 의 볼륨 마운트(/volume1/docker/ecadminapi/logs:/app/logs)에 맞춰 컨테이너 내부 경로로 수정.
    path: /app/logs
  # level: hibernate SQL 로그 — p6spy 사용 중이므로 비활성 (중복 출력 방지)
