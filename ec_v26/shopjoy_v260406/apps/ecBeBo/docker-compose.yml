# ═══════════════════════════════════════════════════════════
#  ShopJoy EcAdminApi - Docker Compose (실제 NAS 운영에 쓰이는 원본)
# ═══════════════════════════════════════════════════════════
#  배치 위치: apps/ecBeBo/docker-compose.yml
#  실행 명령: docker compose up -d --build
#
#  2026-09-05: _doc/정책서-배포-시놀로지/docker/docker-compose.yml 에서 여기로 이동.
#  그 자리에 있던 옛 버전(postgres/redis 컨테이너 + GitHub 원격 build context + 포트 31000,
#  실제로는 한 번도 쓰인 적 없음)은 폐기. 이 파일이 진짜 원본이며 GitHub Actions
#  (shopjoy-be-illeesam-synol-deploy.yml)가 이 경로를 배포 트리거 + 배포 산출물로 사용한다.
#
#  2026-09-06 대개편 — "4개 앱(ecBeBo/ecBeCdn/ecFeBo/ecBeRedis)이 각자 다른 호스팅사에
#  흩어질 수도 있다"는 최악의 경우를 기준으로 완전 분리 설계로 전환하면서, 이 파일에 같이
#  얹혀있던 nginx 서비스를 apps/ecFeBo/docker-compose.yml 로 완전히 독립시켰다. 이 백엔드는
#  이제 nginx 없이도 단독으로 공개 가능해야 하므로, 포트를 "디버깅 전용(21080)"에서
#  "정식 공개 포트(22300)"로 승격했다 — CORS(CorsOriginPolicy.java)가 이미 이 시나리오를
#  지원한다(프론트가 어느 호스트에 있든 절대 URL로 이 포트를 직접 호출).
# ═══════════════════════════════════════════════════════════

services:
  ecbebo:
    # ───── 빌드 설정 ─────
    # context: Dockerfile이 있는 위치 기준 (현재 디렉터리)
    build:
      context: .
      dockerfile: Dockerfile

    # 빌드된 이미지 태그
    # 2026-09-06: shopjoy/ecadminapi → shopjoy/ecbebo (apps/ecBeBo 폴더명 리네임에 맞춤. 컨테이너
    # 레벨 이름만 바꾼 것 — Java 패키지(com.shopjoy.ecadminapi)/애플리케이션 클래스명은 별개로 유지)
    image: shopjoy/ecbebo:latest

    # ───── 컨테이너 식별 ─────
    # 2026-09-06: 210-ecBeBo → shopjoy-ecBeBo-22300 (컨테이너 이름 규칙 shopjoy-{앱}-{포트} 통일).
    container_name: shopjoy-ecBeBo-22300

    # ───── 호스트(NAS 자신) 접근 — 2026-09-02 추가 ─────
    # Postgres(17632)가 이 NAS의 별도 컨테이너로 떠 있는 구성에서, 앱 컨테이너가 DB_HOST
    # 기본값(illeesam.synology.me = 이 NAS 자신의 공인 DDNS)으로 접속하면 컨테이너 네트워크
    # 밖으로 나갔다가 다시 자기 자신으로 들어오는 NAT 헤어핀 경로를 타게 되어 라우터/방화벽에
    # 따라 SocketTimeoutException 으로 실패하기 쉽다(실측 확인). host.docker.internal 로
    # 호스트를 직접 가리키면 이 왕복을 건너뛴다 — .env 의 DB_HOST=host.docker.internal 과 짝.
    # (DB 가 이 NAS가 아니라 정말 외부 서버라면 이 설정은 있어도 무해 — 안 쓰면 그만이다.)
    # 2026-09-06: EcCdnApi(같은 NAS에 있을 경우)도 이 방식으로 부른다 — .env 의
    # CF_CDN_BASE_URL=http://host.docker.internal:22400 (더 이상 Docker 내부 DNS 이름으로
    # 안 부른다 — shopjoy-net 공유가 사라졌으므로). CDN이 다른 호스팅사로 가면 이 값만
    # 그 서버의 실제 공개 URL로 바꾸면 된다 — 코드/컴포즈 변경 불필요.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # ───── 환경변수 ─────
    # .env 파일을 자동으로 읽어 컨테이너에 주입
    env_file:
      - .env

    # 인라인 환경변수 (.env 보다 우선순위 높음)
    environment:
      JAVA_OPTS: "-Xms256m -Xmx1024m"

    # ───── 포트 매핑 (호스트:컨테이너) ─────
    # 2026-09-06: 21080(디버깅 전용) → 22300(정식 공개 포트)로 승격 — nginx가 더 이상 앞에
    # 없으므로 이 포트가 곧 이 백엔드의 유일한 공개 진입점이다. 방화벽/공유기 포트포워딩은
    # 이 포트로 연결할 것. DSM 리버스 프록시로 22300.illeesam.synology.me(HTTPS) 서브도메인을
    # 이 포트로 연결하면 브라우저 secure-context 요구(crypto.subtle 등)도 만족한다(수동 등록 필요).
    ports:
      - "22300:3000"

    # ───── 볼륨 마운트 ─────
    # 로그를 호스트에 보관하여 컨테이너 삭제 시에도 보존
    volumes:
      # 2026-09-06: /volume1/docker/ecadminapi/logs → /volume1/docker/shopjoy/ecBeBoLogs
      # (다른 앱들의 ecBeCdnStorage 등과 같은 명명 원칙에 맞춤). NAS 상 실제 폴더 이동은
      # deploy-dev-synol-be-ecBeBo.js 배포 시 자동 처리(기존 로그 보존).
      - /volume1/docker/shopjoy/ecBeBoLogs:/app/logs

    # ───── 재시작 정책 ─────
    # unless-stopped: NAS 재부팅 시 자동 시작 (수동 정지한 경우 제외)
    restart: unless-stopped

    # ───── Health Check ─────
    # Dockerfile에 정의된 것을 오버라이드 가능. spring-boot-starter-actuator 는 이미 의존성에
    # 있고 application-prod.yml 이 health,info 를 노출하므로 SPRING_PROFILES_ACTIVE=prod(또는
    # dev) 로 띄우면 정상 응답한다 — local 프로파일은 actuator 를 의도적으로 전부 꺼두므로
    # (application-local.yml) 로컬 테스트 시엔 이 헬스체크가 항상 실패로 보이는 게 정상이다.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

    # ───── 로그 드라이버 (디스크 보호) ─────
    logging:
      driver: "json-file"
      options:
        max-size: "10m"   # 단일 로그 파일 최대 크기
        max-file: "5"     # 보관할 로그 파일 개수

# 2026-09-06: nginx 서비스는 apps/ecFeBo/docker-compose.yml 로 분리 이동. shopjoy-net
# 공유 네트워크도 함께 폐기 — EcCdnApi/nginx를 Docker 내부 DNS 이름으로 부르던 리버스
# 프록시가 사라졌으므로 이 컨테이너가 다른 컨테이너와 네트워크를 공유할 이유가 없다
# (완전 독립). 별도 networks: 블록 없이 compose 기본 네트워크만 사용.
