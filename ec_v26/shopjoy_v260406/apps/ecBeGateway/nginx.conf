# apps/ecBeGateway/nginx.conf — 2026-09-06 신설.
#
# ⚠ 테스트 전용 컨테이너다. 2026-09-06 "4개 앱(ecBeBo/ecBeCdn/ecFeBo/ecBeRedis)이 각자
# 다른 호스팅사에 흩어질 수도 있다"는 최악의 경우 기준으로 nginx의 프록시 역할을 apps/ecFeBo
# 에서 완전히 제거했는데(정적 파일만 서빙), 이 게이트웨이는 "다 같은 NAS에 co-located일 때
# 옛날처럼 한 origin 으로 묶어서 보고 싶다"는 로컬 테스트 편의를 위해 그 프록시 기능만 별도로
# 복원한 것이다 — 정식 배포 경로가 아니라 apps/ecBeBo·apps/ecBeCdn·apps/ecFeBo 각자의
# 독립 배포가 원칙이다.
#
# ecBeBo/ecBeCdn을 Docker 내부 DNS 이름이 아니라 host.docker.internal:{포트}로 부른다 —
# shopjoy-net 같은 공유 네트워크를 다시 만들지 않기 위함(이 게이트웨이도 완전 독립 컨테이너).
# 세 앱이 전부 같은 NAS에 떠서 각자의 호스트 포트(22300/22400)로 공개돼 있어야 동작한다.

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 2026-09-06(실측으로 발견) — HTTPS 서브도메인(예: 22099.illeesam.synology.me) 접속은
    # DSM 리버스 프록시가 TLS 를 종료하고 이 컨테이너엔 평문 HTTP 로 넘긴다. 그 결과 이 nginx
    # 자신이 보는 $scheme 은 항상 http 라서, 그걸 그대로 리다이렉트/X-Forwarded-Proto 에 쓰면
    # 원래 HTTPS 로 들어온 요청도 http:// 로 리다이렉트되거나 백엔드가 http 로 착각한다.
    # DSM 이 이미 보내주는 X-Forwarded-Proto 를 우선 신뢰하고, 없을 때만 $scheme 으로 폴백.
    map $http_x_forwarded_proto $real_scheme {
        default $scheme;
        https   https;
        http    http;
    }

    # ecBeBo(백엔드) — 호스트 포트 22300으로 공개된 컨테이너를 host-gateway 경유로 호출.
    upstream ec_admin_api {
        server host.docker.internal:22300;
    }

    # ecBeCdn(CDN 서버) — 호스트 포트 22400.
    upstream ec_cdn_api {
        server host.docker.internal:22400;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/javascript application/json application/xml
        image/svg+xml;

    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;
        include /etc/nginx/security-headers.conf;

        include /etc/nginx/locations.conf;
    }
}
