# security-headers.conf — apps/ecFeBo/security-headers.conf 와 완전히 동일(테스트용 게이트웨이도
# 같은 보안 헤더 정책 적용). nginx.conf 의 server 블록에서 include 한다.
#
# CSP(Content-Security-Policy) 는 일부러 안 넣었다 — Vue 3 CDN 런타임 컴파일러가 템플릿을
# new Function() 으로 컴파일해서 script-src 에 'unsafe-eval' 이 사실상 필수고, 코드 전체에
# 인라인 style="..." 속성이 광범위하게 쓰여서 style-src 도 'unsafe-inline' 없인 거의 다 막힌다 —
# 이 상태로 CSP를 넣어봐야 사실상 전부 허용하는 CSP라 보호 효과가 없다.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "0" always;
