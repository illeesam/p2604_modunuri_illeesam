# ═══════════════════════════════════════════════════════════
#  ShopJoy Gateway (테스트 전용) - Docker Compose
# ═══════════════════════════════════════════════════════════
#  배치 위치: apps/ecBeGateway/docker-compose.yml
#  실행 명령: docker compose up -d   (이미지만 pull — 빌드 대상 없음, 공식 nginx 이미지 그대로 사용)
#
#  2026-09-06 신설 — "4개 앱(ecBeBo/ecBeCdn/ecFeBo/ecBeRedis)이 각자 다른 호스팅사에 흩어질
#  수도 있다"는 최악의 경우 기준으로 apps/ecFeBo 의 nginx에서 리버스프록시 역할을 완전히
#  제거했는데(정적 파일만 서빙), 이 컨테이너는 "다 같은 NAS에 co-located일 때 예전처럼 한
#  origin 으로 묶어서 테스트하고 싶다"는 용도로만 별도로 만든 것 — 정식 배포 경로가 아니다.
#  ecBeBo/ecBeCdn/ecFeBo 각자의 독립 배포가 여전히 원칙이며, 이 게이트웨이는 그 세 컨테이너가
#  전부 이 NAS에 이미 떠 있어야만(호스트 포트 22300/22400/정적파일) 동작한다.
#
#  ⚠️ 테스트용이라 restart 정책도 unless-stopped 가 아니라 "no"로 둔다 — NAS 재부팅 시
#     자동으로 다시 뜨지 않는 게 맞다(상시 운영 컨테이너가 아니므로).
# ═══════════════════════════════════════════════════════════

services:
  ecbegateway:
    image: nginx:1.27-alpine
    container_name: shopjoy-ecBeGateway-22099

    # ───── 호스트(같은 NAS의 ecBeBo/ecBeCdn) 접근 ─────
    # Docker 내부 DNS 이름이 아니라 host.docker.internal:{포트}로 부른다(nginx.conf 참조) —
    # shopjoy-net 같은 공유 네트워크를 다시 만들지 않기 위해서다(이 컨테이너도 완전 독립).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # ───── 포트 매핑 ─────
    ports:
      - "22099:80"

    # ───── 볼륨 마운트 ─────
    # nginx.conf/locations.conf/security-headers.conf: 이 compose 파일과 같은 디렉터리.
    # html: ecFeBo 가 이미 배포해둔 정적 파일 루트를 그대로 재사용(읽기전용, 별도 배포 불필요) —
    #   scripts/scripts_deploy_illeesam_synol/deploy/ 에서 npm run "apps DEPLOY ecFeBo-22000 (nginx-vue3cdn)" 가 채워둔 그 폴더를 이
    #   게이트웨이도 같이 읽는다.
    # 2026-09-06 재구조화(요청사항: "shopjoy 아래 혼재돼 있던 폴더를 apps/storage/data/logs
    # 로 분류") — ecFeBo → apps/ecFeBo.
    # 2026-09-06(요청사항: "logs 는 안 남기나 — dev 에서는 로그 남겨줘") — nginx 공식 이미지는
    # /var/log/nginx/{access,error}.log 를 컨테이너 안에서 /dev/stdout·/dev/stderr 로 심볼릭
    # 링크해둔다(그래서 지금까지는 docker logs 로만 보였음). 아래처럼 그 디렉터리 자체를
    # 실경로로 바인드마운트하면 그 심볼릭 링크가 가려지면서 nginx 가 진짜 파일로 쓰기 시작한다
    # — EcBeBo/EcBeCdn 이 logs/ 아래에 실제 로그 파일을 남기는 것과 같은 결과를 얻는 대신,
    # ⚠ 그 순간부터 `docker compose logs`/`docker logs` 로는 nginx access/error 가 더 이상
    # 안 보인다(대신 아래 경로의 파일을 직접 tail 할 것). 컨테이너 시작/설정 관련 메시지는
    # 여전히 stdout 으로 나가므로 `docker compose logs` 자체가 완전히 비진 않는다.
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./locations.conf:/etc/nginx/locations.conf:ro
      - ./security-headers.conf:/etc/nginx/security-headers.conf:ro
      - /volume1/docker/shopjoy/apps/ecFeBo:/usr/share/nginx/html:ro
      - /volume1/docker/shopjoy/logs/ecBeGatewayLogs:/var/log/nginx

    # 2026-09-06 — 순정 nginx 이미지라 EcBeBo/EcBeCdn 의 banner.txt(${shopjoy.version}) 방식이
    # 안 통한다. 대신 Docker 레이블로 동일 정보를 붙여
    # `docker inspect shopjoy-ecBeGateway-22099 --format '{{.Config.Labels}}'` 로 확인 가능하게
    # 한다 — 배포마다 다른 앱들과 같은 값으로 수동으로 올릴 것.
    labels:
      shopjoy.version: "v1.0.0.20260906"

    restart: "no"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

# 다른 컨테이너와 네트워크를 공유하지 않는다(host.docker.internal 경유로만 통신) — 별도
# networks: 블록 없이 compose 기본 네트워크만 사용.
