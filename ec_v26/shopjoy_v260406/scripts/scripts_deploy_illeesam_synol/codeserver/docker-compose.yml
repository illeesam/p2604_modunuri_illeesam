# ═══════════════════════════════════════════════════════════
#  ShopJoy CodeServer(브라우저용 VS Code) - Docker Compose 템플릿
# ═══════════════════════════════════════════════════════════
#  배치 위치(원본, git 추적): scripts/scripts_deploy_illeesam_synol/codeserver/docker-compose.yml
#  (apps/ 밑에 안 둔 이유: apps/ 는 shopjoy 5개 실제 앱 전용 — 이 개발도구는 무관하다는
#  요청사항에 따라 배포 스크립트와 같은 codeserver/ 폴더에 같이 둠, 2026-09-07)
#  대상 NAS: Synology DS920+ (illeesam.synology.me)
#
#  2026-09-07 신설 → 같은 날 개편(요청사항: "codeserver 1,2,3,4,5 5개를 만들수 있게 구성해줘
#  중지도 삭제도") — 인스턴스 1개 고정이 아니라 **1~5번 중 원하는 번호를 골라 독립된 인스턴스로
#  띄울 수 있는 템플릿**으로 바뀌었다. 이 파일 자체는 그대로 두고, 배포 스크립트
#  (deploy-dev-synol-cs-ecCodeServer.js)가 실행 시 받은 인스턴스 번호(1~5)로
#  __CS_INSTANCE__ / __CS_PORT__ 두 자리표시자를 실제 값으로 치환한 사본을 NAS의 각자
#  전용 폴더(apps/ecCodeServer{N}/)에 올린다 — 그래서 인스턴스마다 별도 docker-compose
#  프로젝트로 완전히 독립 운영된다(같은 이미지를 쓰되 컨테이너/포트/볼륨은 전부 별개).
#
#  포트 규칙(요청사항: "포트는 22911 22912 22913 22914 22915") — 1번=22911, 2번=22912,
#  3번=22913, 4번=22914, 5번=22915. 기존 DSM Container Manager로 수동 생성된 인스턴스
#  (포트 51100/51200)와도, ecBeBo(22300)/ecBeCdn(22400)/ecFeBo(22000)/ecBeRedis(22379)/
#  ecBeGateway(22099) 등 shopjoy 5개 앱과도 겹치지 않는다.
#
#  ⚠️ code-server는 브라우저에서 터미널까지 여는 도구라 비밀번호가 곧 이 NAS 전체에 대한
#     원격 셸 접근권이나 마찬가지다 — PASSWORD/SUDO_PASSWORD 를 절대 이 파일에 하드코딩하지
#     않는다. 배포 스크립트가 인스턴스별로 각각 최초 배포 시 NAS에서 강한 난수를 직접
#     생성해 env/ecCodeServer{N}.env 에 저장하고(이미 있으면 절대 덮어쓰지 않음), 그 값을
#     배포 로그/이메일에 한 번 보여준다(ecBeRedis의 "REDIS_PASSWORD 없으면 생성" 패턴과 동일
#     구조, 다만 여기는 위험도가 훨씬 높아 고정 기본값이 아니라 매번 새로 생성한 난수를 쓴다).
# ═══════════════════════════════════════════════════════════

services:
  codeserver:
    image: lscr.io/linuxserver/code-server:latest
    # __CS_INSTANCE__/__CS_PORT__ 는 배포 스크립트가 업로드 직전 실제 숫자로 치환하는
    # 자리표시자다(문자 그대로 이 이름이면 아직 치환 전 원본 = 실행 대상 아님).
    container_name: shopjoy-ecCodeServer__CS_INSTANCE__-__CS_PORT__

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Seoul
      # env/ecCodeServer__CS_INSTANCE__.env 에서 채워짐(배포 스크립트가 최초 1회 자동 생성,
      # 인스턴스별로 서로 다른 값) — 미설정 시 컨테이너가 부팅 로그에 무작위 1회성 비밀번호를
      # 스스로 찍어 표시(linuxserver 이미지 기본 동작). 그래도 재기동마다 값이 바뀌어
      # 불편하므로 이 프로젝트는 항상 고정값을 준다.
      - PASSWORD=${CODE_SERVER_PASSWORD}
      # 컨테이너 안에서 sudo 쓸 때 필요(웹 로그인 비밀번호와 같은 값 재사용 — 별도로 관리할
      # 비밀 하나를 더 늘리지 않기 위함).
      - SUDO_PASSWORD=${CODE_SERVER_PASSWORD}
      # 브라우저로 열었을 때 기본으로 펼쳐질 폴더 — 지금까지 수동 인스턴스에서 매번
      # ~/workspace 로 직접 이동해서 열던 것을 기본값으로 고정.
      - DEFAULT_WORKSPACE=/config/workspace

    # ───── 포트 매핑 ─────
    # linuxserver/code-server 컨테이너 내부는 8443(HTTPS, 자체서명 인증서)으로 서빙한다.
    ports:
      - "__CS_PORT__:8443"

    # ───── 볼륨 마운트 ─────
    # /config 전체를 영구 보존 — git clone한 소스(~/workspace), VS Code 설정, 설치한 확장
    # (Claude Code for VS Code 등) 이 컨테이너 재생성 후에도 그대로 남는다. 인스턴스마다
    # 완전히 별도 경로라 서로 간섭하지 않는다(1번 작업이 2번에 안 보임 — 의도된 격리).
    volumes:
      - /volume1/docker/shopjoy/data/ecCodeServer__CS_INSTANCE__Config:/config

    restart: unless-stopped

    labels:
      shopjoy.version: "v1.0.0.20260907"
