# ═══════════════════════════════════════════════════════════
#  ShopJoy CodeServer(브라우저용 VS Code) - Docker Compose 템플릿
# ═══════════════════════════════════════════════════════════
#  배치 위치(원본, git 추적): scripts/scripts_deploy_illeesam_synol/codeserver/docker-compose.yml
#  (apps/ 밑에 안 둔 이유: apps/ 는 shopjoy 5개 실제 앱 전용 — 이 개발도구는 무관하다는
#  요청사항에 따라 배포 스크립트와 같은 codeserver/ 폴더에 같이 둠, 2026-09-07)
#  대상 NAS: Synology DS920+ (illeesam.synology.me)
#
#  2026-09-07 신설 → 같은 날 여러 차례 개편(요청사항: "codeserver 1,2,3,4,5 5개를 만들수
#  있게 구성해줘 중지도 삭제도") — 인스턴스 1개 고정이 아니라 **1~5번 중 원하는 번호를 골라
#  독립된 인스턴스로 띄울 수 있는 템플릿**이다. 이 파일 자체는 그대로 두고, 배포 스크립트
#  (deploy-dev-synol-cs-ecCodeServer.js)가 실행 시 받은 인스턴스 번호(1~5)로
#  __CS_INSTANCE__/__CS_PORT_UI__/__CS_PORT_HTTP__/__CS_PORT_DEV__ 네 자리표시자를 실제
#  값으로 치환한 사본을 NAS의 각자 전용 폴더(apps/ecCodeServer{N}/)에 올린다 — 그래서
#  인스턴스마다 별도 docker-compose 프로젝트로 완전히 독립 운영된다.
#
#  포트 규칙(요청사항: "포트는 25100/25200/25300/25400/25500, 예를 들어 25100 기준으로
#  443은 25100, 80은 25180, 3000은 25130") — 인스턴스당 기준포트(25000+100×번호)에서:
#    - 기준포트+0  → 컨테이너 8443(code-server 웹 UI 본체 — 사용자가 말한 "443")
#    - 기준포트+80 → 컨테이너 80  (인스턴스 안에서 돌리는 로컬 웹서버 미리보기용)
#    - 기준포트+30 → 컨테이너 3000(인스턴스 안에서 돌리는 Node/Vite 등 dev 서버 미리보기용)
#  1번=25100/25180/25130, 2번=25200/25280/25230, 3번=25300/25380/25330,
#  4번=25400/25480/25430, 5번=25500/25580/25530. 기존 22911~22915(구 방식)와도,
#  DSM Container Manager로 수동 생성된 인스턴스(포트 51100/51200)와도, shopjoy 5개 앱
#  (ecBeBo 22300/ecBeCdn 22400/ecFeBo 22000/ecBeRedis 22379/ecBeGateway 22099)과도
#  겹치지 않는다.
#
#  ⚠️ code-server는 브라우저에서 터미널까지 여는 도구라 비밀번호가 곧 이 NAS 전체에 대한
#     원격 셸 접근권이나 마찬가지다. 2026-09-07 요청사항으로 5개 인스턴스 전부 고정
#     비밀번호(1)를 쓰지만, 그 값조차 이 git 추적 파일엔 절대 하드코딩하지 않는다 — 이
#     저장소는 Public이라(CLAUDE.md 참조) 여기 적히는 순간 전 세계에 공개된다. 실제 값은
#     배포 스크립트가 NAS의 env/ecCodeServer{N}.env(git 미추적)에 써두고 compose 는
#     ${CODE_SERVER_PASSWORD} 로만 참조한다.
# ═══════════════════════════════════════════════════════════

services:
  codeserver:
    image: lscr.io/linuxserver/code-server:latest
    # __CS_INSTANCE__/__CS_PORT_UI__ 는 배포 스크립트가 업로드 직전 실제 숫자로 치환하는
    # 자리표시자다(문자 그대로 이 이름이면 아직 치환 전 원본 = 실행 대상 아님).
    container_name: shopjoy-ecCodeServer__CS_INSTANCE__-__CS_PORT_UI__

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Seoul
      # env/ecCodeServer__CS_INSTANCE__.env 에서 채워짐(배포 스크립트가 최초 1회 자동 생성,
      # 요청사항에 따라 5개 인스턴스 전부 동일한 고정값 "1"로 저장됨).
      - PASSWORD=${CODE_SERVER_PASSWORD}
      # 컨테이너 안에서 sudo 쓸 때 필요(웹 로그인 비밀번호와 같은 값 재사용 — 별도로 관리할
      # 비밀 하나를 더 늘리지 않기 위함).
      - SUDO_PASSWORD=${CODE_SERVER_PASSWORD}
      # 브라우저로 열었을 때 기본으로 펼쳐질 폴더 — 지금까지 수동 인스턴스에서 매번
      # ~/workspace 로 직접 이동해서 열던 것을 기본값으로 고정.
      - DEFAULT_WORKSPACE=/config/workspace

    # ───── 포트 매핑 ─────
    # linuxserver/code-server 컨테이너 내부 본체는 8443(HTTPS, 자체서명 인증서)으로 서빙한다.
    # 80/3000 은 code-server 자체가 쓰는 포트가 아니라, 이 인스턴스 "안에서" 사용자가 직접
    # 띄우는 로컬 웹서버/dev 서버를 밖에서 바로 미리보기 할 수 있도록 미리 뚫어둔 통로다.
    ports:
      - "__CS_PORT_UI__:8443"
      - "__CS_PORT_HTTP__:80"
      - "__CS_PORT_DEV__:3000"

    # ───── 볼륨 마운트 ─────
    # /config 전체를 영구 보존 — git clone한 소스(~/workspace), VS Code 설정, 설치한 확장
    # (Claude Code for VS Code 등) 이 컨테이너 재생성 후에도 그대로 남는다. 인스턴스마다
    # 완전히 별도 경로라 서로 간섭하지 않는다(1번 작업이 2번에 안 보임 — 의도된 격리).
    volumes:
      - /volume1/docker/shopjoy/data/ecCodeServer__CS_INSTANCE__Config:/config

    restart: unless-stopped

    labels:
      shopjoy.version: "v1.0.0.20260907"
