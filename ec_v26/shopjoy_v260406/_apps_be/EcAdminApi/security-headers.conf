# security-headers.conf — 2026-08-30 추가. nginx.conf 의 각 server 블록에서 include 한다.
# HTTP(80)/HTTPS(443) 블록에 공통 적용 — 한 곳만 고치면 양쪽에 반영됨(중복 방지).
#
# CSP(Content-Security-Policy) 는 일부러 안 넣었다 — Vue 3 CDN 런타임 컴파일러가 템플릿을
# new Function() 으로 컴파일해서 script-src 에 'unsafe-eval' 이 사실상 필수고, 코드 전체에
# 인라인 style="..." 속성이 광범위하게 쓰여서 style-src 도 'unsafe-inline' 없인 거의 다 막힌다 —
# 이 상태로 CSP를 넣어봐야 사실상 전부 허용하는 CSP라 보호 효과가 없다(오히려 "CSP 있음"이라는
# 잘못된 안심만 준다). 나중에 인라인 스타일/런타임 컴파일을 걷어내는 리팩터를 하면 그때 추가할 것.

add_header X-Content-Type-Options "nosniff" always;        # MIME 스니핑으로 인한 콘텐츠 유형 오인 방지
add_header X-Frame-Options "SAMEORIGIN" always;             # 클릭재킹 방지 — 단, 같은 출처 iframe(예: bo-pd-opt-code-mng.html 내부 iframe)은 허용
add_header Referrer-Policy "strict-origin-when-cross-origin" always; # 외부 링크 클릭 시 넘어가는 referrer 정보 최소화
add_header X-XSS-Protection "0" always;                     # 레거시 브라우저 XSS 필터는 오히려 취약점을 만들 수 있어 명시적으로 끔(백엔드 응답 헤더와 동일 정책)
