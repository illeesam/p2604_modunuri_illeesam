# locations.conf — 2026-08-30 분리. 정적 서빙 + API 프록시 규칙 본체.
# HTTP(80)/HTTPS(443) 두 server 블록이 이 파일 하나를 include 해서 공유한다 — HTTPS 활성화
# 하겠다고 이 규칙들을 통째로 복사해서 두 벌 관리하면 나중에 한쪽만 고치고 잊어버리는 사고가
# 나기 쉬워서, 애초에 파일을 하나로 묶어 양쪽이 항상 같은 규칙을 쓰도록 한다.

# ── ① CDN 로컬 패키지(assets/cdn/pkg/<lib>/<버전>/...) — 경로 자체에 버전이
#    박혀있어 내용이 절대 안 바뀐다(버전 올리면 경로가 바뀜) → 1년 캐시 + immutable 안전.
#    반드시 아래 ③(app.js) 규칙보다 먼저 와야 한다 — nginx location 은 더 긴/구체적인
#    prefix 가 먼저 매치되지만, 정규식(~)끼리는 "먼저 선언된 것"이 우선이라 순서 중요. ──
location ~* ^/assets/cdn/pkg/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# ── ② 이미지/폰트류 — 버전 경로가 없어 무한 캐시는 위험하지만, 자주 안 바뀌므로
#    적당히 길게(7일). 배포로 이미지가 바뀌면 최대 7일간 구버전이 보일 수 있음을
#    감안한 값 — 더 짧게 원하면 낮추면 됨. ──
location ~* \.(png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot)$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=604800" always;
}

# ── ③ 앱 소스(JS/CSS/HTML) — 버전 해시가 없는 "빌드 없음" 구조라 오래 캐시하면
#    배포 직후에도 브라우저가 구버전 JS를 계속 쓰는 사고가 난다. FoSeoService.readTemplate()
#    이 "매 요청마다 다시 읽어 배포 반영이 즉시 되게" 하는 것과 같은 원칙을 여기도 적용 —
#    no-cache 는 "저장은 하되 매번 서버에 물어보고 써라"(304 면 재전송 없음, ETag/
#    Last-Modified 는 nginx 정적 서빙이 자동으로 붙여준다) — 캐시 자체를 끄는
#    no-store 와 다르다. ──
location ~* \.(js|css|html)$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache" always;
}

# ── ④ 백엔드 API/SEO 랜딩 — 기존 그대로 프록시. FoSeoController 응답은 자체
#    Cache-Control(max-age=300)을 이미 설정하므로 여기서 덮어쓰지 않는다. ──
location /api/ {
    proxy_pass http://ec_admin_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
location /foui/ {
    proxy_pass http://ec_admin_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
# /cdn/** — 사용자 업로드 이미지 등 DB/디스크 기반 동적 서빙(WebConfig.java). 버전 경로가
# 아니라 같은 URL 이 나중에 다른 내용으로 바뀔 수 있어(재업로드 등) 짧게만 캐시.
location /cdn/ {
    proxy_pass http://ec_admin_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Cache-Control "public, max-age=86400" always;
}

# /api/cdn/, /api/auth/ — EcCdnApi 관리 API(로그인/cf_client·cf_file CRUD). 2026-09-06 추가.
# /api/ 보다 더 구체적인 prefix 라 nginx 가 longest-prefix-match 로 이 규칙을 먼저 고른다
# (선언 순서 무관 — 정규식(~) 위치와 달리 일반 prefix location 끼리는 길이로만 경쟁).
location /api/cdn/ {
    proxy_pass http://ec_cdn_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
location /api/auth/ {
    proxy_pass http://ec_cdn_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# /cdn-admin/ — EcCdnApi 관리자 정적 화면(static/home/index.html, css/js 등) 전용 prefix. 2026-09-06 추가.
# ⚠️ prefix 없이 그냥 /index.html, /css/*.css, /js/*.js 로 노출하면 안 된다 — 아래 ③ 규칙
# (확장자 기준 정적서빙, root=/usr/share/nginx/html)이 EcAdminApi 자기 프론트(FO 사이트)의
# index.html/css/js 와 파일명이 그대로 겹쳐서 그쪽이 응답해버린다(실제로 2026-09-06 겪음).
# ^~ 를 반드시 붙여야 한다 — 안 붙이면 prefix 매치를 찾아도 nginx 가 계속 정규식(③)을 검사해서
# 결국 ③이 이긴다(정규식은 prefix 보다 우선순위가 높음, ^~ 만이 그 규칙을 뒤집는 예외).
# 2026-09-06 추가 변경: EcCdnApi 쪽 화면 프로그램 파일들이 static/index.html 등에서
# static/home/index.html 등으로 이동해서(요청사항) rewrite 대상도 /home/$1 로 맞춘다 — 외부에
# 노출되는 /cdn-admin/... URL 자체는 그대로라 이미 공유된 링크는 안 바뀐다.
location ^~ /cdn-admin/ {
    rewrite ^/cdn-admin/(.*)$ /home/$1 break;
    proxy_pass http://ec_cdn_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# /admin-tools/ — EcAdminApi 운영 도구 정적 화면(static/home/index.html, 로그뷰어 등) 전용 prefix.
# 2026-09-06 추가. 위 /cdn-admin/ 과 완전히 같은 이유로 prefix 가 필요하다: 그냥 /index.html 로
# 노출하면 위 ③ 규칙(확장자 기준, root=/usr/share/nginx/html)이 EcAdminApi 자기 프론트(FO 사이트)
# 의 index.html 과 파일명이 그대로 겹쳐서 그쪽이 먼저 응답해버린다. ^~ 로 정규식(③)보다 우선시킨다.
# 2026-09-06 추가 변경: 화면 프로그램 파일들이 static/index.html 등에서 static/home/index.html
# 등으로 이동해서(요청사항) rewrite 대상도 /home/$1 로 맞춘다 — 외부 노출 URL 자체는 그대로.
location ^~ /admin-tools/ {
    rewrite ^/admin-tools/(.*)$ /home/$1 break;
    proxy_pass http://ec_admin_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# /cf/ — EcCdnApi(동영상 스트리밍/이미지 링크/파일) 프록시. 2026-09-06 추가.
# 원본/썸네일/프레임 이미지(/cf/file,thumbnail,frame/**)와 동영상 스트리밍(/cf/stream/**) 전부
# 브라우저가 <img>/<video> 로 직접 요청 — EcCdnApi 쪽이 이미 permitAll 이라 여기도 인증 없음.
location /cf/ {
    proxy_pass http://ec_cdn_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 동영상 스트리밍(Range 요청) — 버퍼링을 끄면 nginx가 응답을 전부 모았다 보내지 않고
    # EcCdnApi 가 만드는 첫 바이트를 곧장 클라이언트로 흘려보낸다(탐색 반응성 확보).
    proxy_buffering off;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# ── ⑤ 그 외 전부(루트 index.html/bo.html, favicon 등 확장자 없는 요청) — 프론트
#    정적 루트에서 직접 서빙. 못 찾으면 백엔드로 폴백(하위호환 안전망).
#    2026-09-04: try_files 에 $uri 만 있으면 "/"(디렉터리)는 "파일 아님"으로 바로 실패해 곧장
#    @backend로 떨어진다(백엔드 루트는 인증 필요 → 401). $uri/ 를 추가해야 디렉터리로 인식해
#    index 지시어(index.html)가 실제로 적용된다 — try_files $uri $uri/ ... 가 nginx 표준 관용구. ──
location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ @backend;
}
location @backend {
    proxy_pass http://ec_admin_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
