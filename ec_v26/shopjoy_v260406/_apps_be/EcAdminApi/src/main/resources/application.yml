# application.yml — 공통 설정 / 프로파일별: application-{local|dev|prod}.yml
#
# ═══════════════════════════════════════════════════════════════════════════
#  실행 명령어 모음 (java -jar) — 2026-08-30 추가
#  jar 는 ./gradlew bootJar 로 만든다(build/libs/EcAdminApi-0.0.1-SNAPSHOT.jar).
#  버전이 바뀌면 실제 파일명을 다시 확인할 것: ls build/libs/
#  각 줄은 셸(PowerShell/cmd/bash) 구분 없이 그대로 콘솔에 붙여넣기 가능 — java 프로그램
#  인자라 셸 문법에 안 걸린다(줄바꿈 이어쓰기 문자를 안 써서 셸마다 다른 문제도 없음).
#
#  DB_* 는 전부 기본값이 있어서(illeesam.synology.me 공유 개발DB) local/dev 는 안 넘겨도
#  뜬다 — prod 만 JWT_SECRET/LICENSE_SECRET/FRONTEND_DIR/FRONTEND_BASE_URL/AWS_*/NCP_* 가
#  기본값 없이 필수라 반드시 넘겨야 부팅된다(하나라도 빠지면 플레이스홀더 해석 실패로
#  부팅 자체가 안 됨 — 그래서 prod 에는 "①심플" 예시가 따로 없다).
#
# ── ① 로컬(local) ────────────────────────────────────────────────────────
#  1) 심플 실행:
#    java -jar build/libs/EcAdminApi-0.0.1-SNAPSHOT.jar --spring.profiles.active=local
#
#  2) 기본옵션(진짜 로컬 PC의 Postgres로 붙일 때 — application-local.yml 상단 주석의 의도된 조합):
#    java -jar build/libs/EcAdminApi-0.0.1-SNAPSHOT.jar --spring.profiles.active=local --DB_HOST=localhost --DB_PORT=5432 --DB_USERNAME=postgres --DB_PASSWORD=postgres
#
#  3) 다양한 옵션(포트/메모리까지 지정, 공유 개발DB 명시):
#    java -Xms256m -Xmx1024m -jar build/libs/EcAdminApi-0.0.1-SNAPSHOT.jar --spring.profiles.active=local --server.port=3000 --DB_HOST=illeesam.synology.me --DB_PORT=17632 --DB_NAME=postgres --DB_SCHEMA=shopjoy_2604 --DB_USERNAME=postgres --DB_PASSWORD=postgresilleesam
#
# ── ② 개발(dev) ──────────────────────────────────────────────────────────
#  local 과 DB 접속은 같지만 Flyway 활성화 + 로그 파일 경로(C:/_logs/shopjoy)가 다르다.
#  1) 심플 실행:
#    java -jar build/libs/EcAdminApi-0.0.1-SNAPSHOT.jar --spring.profiles.active=dev
#
#  2) 기본옵션(DB 명시):
#    java -jar build/libs/EcAdminApi-0.0.1-SNAPSHOT.jar --spring.profiles.active=dev --DB_HOST=illeesam.synology.me --DB_PORT=17632 --DB_USERNAME=postgres --DB_PASSWORD=postgresilleesam
#
#  3) 다양한 옵션(포트/메모리 + 젠킨스 배치 토큰까지):
#    java -Xms256m -Xmx1024m -jar build/libs/EcAdminApi-0.0.1-SNAPSHOT.jar --spring.profiles.active=dev --server.port=3000 --DB_HOST=illeesam.synology.me --DB_PORT=17632 --DB_NAME=postgres --DB_SCHEMA=shopjoy_2604 --DB_USERNAME=postgres --DB_PASSWORD=postgresilleesam --JENKINS_BATCH_TOKEN=xxxxx
#
# ── ③ 운영(prod) ─────────────────────────────────────────────────────────
#  실제 배포는 Docker(Dockerfile 의 ENTRYPOINT — java -jar app.jar 고정, docker-compose 의
#  .env 로 값 주입)로 하므로, 아래는 컨테이너 밖에서 직접 확인·디버깅할 때 쓰는 용도.
#  ⚠️ <꺾쇠> 부분은 실제 값으로 바꿔서 쓸 것 — 이 파일에 진짜 운영 시크릿을 적어두지 않는다.
#
#  1) 기본옵션(prod 는 필수값이 있어 "심플"이 곧 최소 실행 형태):
#    java -jar app.jar --spring.profiles.active=prod --JWT_SECRET=<실제운영시크릿> --LICENSE_SECRET=<실제라이선스시크릿> --FRONTEND_DIR=/volume1/docker/shopjoy/frontend --FRONTEND_BASE_URL=https://your-domain.com --AWS_ACCESS_KEY_ID=<key> --AWS_SECRET_ACCESS_KEY=<secret> --NCP_ACCESS_KEY=<key> --NCP_SECRET_KEY=<secret>
#
#  2) + DB 명시(운영 DB 계정이 기본값과 다를 때):
#    java -jar app.jar --spring.profiles.active=prod --server.port=3000 --DB_HOST=illeesam.synology.me --DB_PORT=17632 --DB_NAME=postgres --DB_SCHEMA=shopjoy_2604 --DB_USERNAME=postgres --DB_PASSWORD=<운영DB비밀번호> --JWT_SECRET=<실제운영시크릿> --LICENSE_SECRET=<실제라이선스시크릿> --FRONTEND_DIR=/volume1/docker/shopjoy/frontend --FRONTEND_BASE_URL=https://your-domain.com --AWS_ACCESS_KEY_ID=<key> --AWS_SECRET_ACCESS_KEY=<secret> --NCP_ACCESS_KEY=<key> --NCP_SECRET_KEY=<secret>
#
#  3) 다양한 옵션(메모리/타임존/젠킨스/라이선스출력경로까지 전부):
#    java -Xms256m -Xmx1024m -Duser.timezone=Asia/Seoul -jar app.jar --spring.profiles.active=prod --server.port=3000 --DB_HOST=illeesam.synology.me --DB_PORT=17632 --DB_NAME=postgres --DB_SCHEMA=shopjoy_2604 --DB_USERNAME=postgres --DB_PASSWORD=<운영DB비밀번호> --JWT_SECRET=<실제운영시크릿> --LICENSE_SECRET=<실제라이선스시크릿> --FRONTEND_DIR=/volume1/docker/shopjoy/frontend --FRONTEND_BASE_URL=https://your-domain.com --AWS_ACCESS_KEY_ID=<key> --AWS_SECRET_ACCESS_KEY=<secret> --NCP_ACCESS_KEY=<key> --NCP_SECRET_KEY=<secret> --JENKINS_BATCH_TOKEN=<jenkins토큰> --LICENSE_OUTPUT_DIR=./_license-output
#
#  검증: 2026-08-30 이 3개 프로파일 전부 실제 부팅 확인함(prod 는 이 작업 중
#  driver-class-name 불일치 버그를 발견·수정한 뒤 재검증 — 아래 datasource 섹션 참조).
# ═══════════════════════════════════════════════════════════════════════════
#
# ⚠️ 아래 항목은 sy_prop DB 에서 관리 (BO → 시스템 → 프로퍼티 관리):
#    app.auth.social.*  (google-client-id / kakao-js-key / naver-client-id / naver-callback-url / *-userinfo-url)
#    app.pay.toss.*     (confirm-url / cancel-url-base / widget-client-key / secret-key)
#    app.pay.kakaopay.* (cid / secret-key)
#    app.pay.naverpay.* (client-id / client-secret / api-url)
#    app.map.*          (kakao-js-key / naver-map-client-id / google-api-key)
#    spring.mail.host/port/username/password / app.mail.*
#    app.file.storage-type / cdn-host / aws.bucket/region/cdn-url / ncp.bucket/endpoint/cdn-url
#    app.license.secret(local/dev) / app.license.enabled

spring:
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

app:
  # license.secret / license.enabled 는 sy_prop(app.license.*) 에서 주입
  license:
    output-dir: ${LICENSE_OUTPUT_DIR:./_license-output}
  # EcCdnApi(동영상/이미지 CDN 서버) 호출 설정 — CfCdnApiClient 가 사용.
  # 2026-09-06 시점: 클라이언트만 준비됨, 아직 CmUploadService 에 안 붙임(별도 작업으로 진행 예정).
  cf-cdn:
    base-url: ${CF_CDN_BASE_URL:http://localhost:21090}
    client-id: ${CF_CDN_CLIENT_ID:ecadminapi}
    client-pwd: ${CF_CDN_CLIENT_PWD:}

# 마스터 패스워드 — 개발 전용, prod=false 필수
auth:
  master-pwd:
    enabled: ${AUTH_MASTER_PWD_ENABLED:true}
    hash:    ${AUTH_MASTER_PWD_HASH:0ffe1abd1a08215353c233d6e009613e95eec4253832a761af28ff37ac5a150c}

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  config: classpath:logback-spring.xml
  file:
    path: logs
