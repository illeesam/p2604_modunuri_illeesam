<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcAdminApi 운영 도구</title>
<link rel="stylesheet" href="css/log-admin.css">
</head>
<body>
<!-- EcAdminApi 운영 화면(로그뷰어 등) — EcCdnApi 의 static/index.html 구조(상단헤더 + 좌측메뉴 +
     우측콘텐츠, <component> 라우팅)를 그대로 참고해 이식했다(요청사항: "EcCdnApi 프로그램
     참고해줘"). EcAdminApi 의 실제 BO/FO 화면은 프로젝트 루트의 bo.html/index.html 이고, 여기는
     그것과 완전히 별개인 "운영 도구" 전용 화면이다.
     2026-09-06: 로그인 없이 바로 사용(요청사항: "인증없이 누구나 보는거야") — SecurityConfig 가
     /api/co/** 및 정적 리소스(/, /*.html, /css/**, /js/**)를 permitAll 로 열어둠. -->
<div id="app">
  <div class="shell-header">
    <div class="brand">🛠️ EcAdminApi 운영 도구<span class="sub">로그뷰어 등</span></div>
  </div>
  <div class="shell-sidebar">
    <div class="menu-group-label">운영</div>
    <a class="menu-item" :class="{ active: currentPage === 'logViewer' }" @click="currentPage = 'logViewer'">🪵 로그뷰어</a>
  </div>
  <div class="shell-main">
    <log-viewer v-if="currentPage === 'logViewer'"></log-viewer>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script src="js/utils/logAuth.js"></script>
<script src="js/pages/LogViewer.js"></script>
<script>
const { createApp, ref } = Vue;

// ?page=logViewer 로 직접 진입 가능(북마크 편의) — 기본은 logViewer(현재 화면이 1개뿐).
const initialPage = new URLSearchParams(location.search).get('page');
const VALID_PAGES = ['logViewer'];

const app = createApp({
  setup() {
    const currentPage = ref(VALID_PAGES.includes(initialPage) ? initialPage : 'logViewer');
    return { currentPage };
  },
});
app.component('LogViewer', window.LogViewer);
app.mount('#app');
</script>
</body>
</html>
