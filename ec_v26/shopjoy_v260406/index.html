  <!-- ■ H2.1: Site Config & Init Scripts ■ -->
  <script>
    /* ═══════════════════════════════════════════════════════════════════
       사이트 기본값 설정 (변경 시 이 한 줄만 수정)
       ═══════════════════════════════════════════════════════════════════ */
    const DEFAULT_FO_SITE_NO = '01';

    /* /index.html → / 로 단축 (해시/쿼리는 유지) */
    (function(){
      try {
        var p = window.location.pathname;
        if (/\/index\.html$/i.test(p)) {
          var newPath = p.replace(/index\.html$/i, '');
          history.replaceState(null, '', newPath + window.location.search + window.location.hash);
        }
      } catch(_){}
    })();
    /* FO_SITE_NO — URL ?SITE_NO=02 로 오버라이드 가능 */
    (function(){
      var _toSiteId = function(no){ return '260401' + String(no || '01').padStart(10, '0'); };
      try {
        var qs = new URLSearchParams(window.location.search);
        var v = qs.get('SITE_NO');
        if (v) {
          window.FO_SITE_NO = v;
          try {
            qs.delete('SITE_NO');
            var newSearch = qs.toString();
            history.replaceState(null, '', window.location.pathname + (newSearch ? '?' + newSearch : '') + window.location.hash);
          } catch(_){}
        } else {
          var saved = null;
          try { saved = localStorage.getItem('modu-fo-sy-siteNo'); } catch(_){}
          window.FO_SITE_NO = saved || DEFAULT_FO_SITE_NO;
        }
        /* 카멜 키로 영속화 — 값이 바뀔 때만 write (불필요한 storage 이벤트→교차탭 무한 reload 방지) */
        try {
          var _no = String(window.FO_SITE_NO);
          var _id = _toSiteId(window.FO_SITE_NO);
          if (localStorage.getItem('modu-fo-sy-siteNo') !== _no) localStorage.setItem('modu-fo-sy-siteNo', _no);
          if (localStorage.getItem('modu-fo-sy-siteId') !== _id) localStorage.setItem('modu-fo-sy-siteId', _id);
        } catch(_){}
      } catch(e) { window.FO_SITE_NO = DEFAULT_FO_SITE_NO; }
      /* BO_SITE_NO는 bo.html에서 전적으로 관리 — FO에서 접근 금지 */
    })();
    document.write('<link rel="stylesheet" href="assets/css/fo-global-style' + window.FO_SITE_NO + '.css">');
    /* 다른 탭에서 SITE_NO 변경 시에만 1회 반영. 현재 사이트와 같은 값/빈 값이면 무시(무한 reload 방지) */
    window.addEventListener('storage', function(e){
      if (e.key !== 'modu-fo-sy-siteNo') return;
      var nv = e.newValue;
      if (nv && nv !== window.FO_SITE_NO) {
        location.reload();
      }
    });
  </script>

    @keyframes _bootspin { to { transform: rotate(360deg); } }

  <!-- ═══════════════════════════════════════════════════════════════════════

       LocationPage(8개, SEO 노출 대상 공개 콘텐츠)를 크롤러 지연 우려로 eager 로 되돌렸다가,

       데이터 자체가 이미 API 호출로 나중에 채워지는 구조라(컴포넌트 eager 여부와 무관) JS 파일
       하나 더 fetch하는 지연은 상대적으로 미미하다고 판단.
