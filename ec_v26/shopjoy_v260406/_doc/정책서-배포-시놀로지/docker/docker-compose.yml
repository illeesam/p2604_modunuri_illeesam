# ═══════════════════════════════════════════════════════════
#  ShopJoy EcAdminApi - Docker Compose
# ═══════════════════════════════════════════════════════════
#  배치 위치: _apps/EcAdminApi/docker-compose.yml
#  실행 명령: docker compose up -d --build
# ═══════════════════════════════════════════════════════════

services:
  ecadminapi:
    # ───── 빌드 설정 ─────
    # context: Dockerfile이 있는 위치 기준 (현재 디렉터리)
    build:
      context: .
      dockerfile: Dockerfile

    # 빌드된 이미지 태그
    image: shopjoy/ecadminapi:latest

    # ───── 컨테이너 식별 ─────
    container_name: 210-ecadminApi

    # ───── 호스트(NAS 자신) 접근 — 2026-09-02 추가 ─────
    # Postgres(17632)가 이 NAS의 별도 컨테이너로 떠 있는 구성에서, 앱 컨테이너가 DB_HOST
    # 기본값(illeesam.synology.me = 이 NAS 자신의 공인 DDNS)으로 접속하면 컨테이너 네트워크
    # 밖으로 나갔다가 다시 자기 자신으로 들어오는 NAT 헤어핀 경로를 타게 되어 라우터/방화벽에
    # 따라 SocketTimeoutException 으로 실패하기 쉽다(실측 확인). host.docker.internal 로
    # 호스트를 직접 가리키면 이 왕복을 건너뛴다 — .env 의 DB_HOST=host.docker.internal 과 짝.
    # (DB 가 이 NAS가 아니라 정말 외부 서버라면 이 설정은 있어도 무해 — 안 쓰면 그만이다.)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # ───── 환경변수 ─────
    # .env 파일을 자동으로 읽어 컨테이너에 주입
    env_file:
      - .env

    # 인라인 환경변수 (.env 보다 우선순위 높음)
    environment:
      JAVA_OPTS: "-Xms256m -Xmx1024m"

    # ───── 포트 매핑 (호스트:컨테이너) ─────
    # 2026-08-30: nginx 도입 후에는 공개 접속은 nginx(21000)를 통하는 게 원칙이라, 이 21080은
    # "백엔드 직접 접근(디버깅용)"으로만 남겨둔다. 방화벽/공유기 포트포워딩은 21000만 열 것 —
    # 21080까지 외부에 열면 nginx의 압축/캐시/정적서빙을 우회해 곧바로 API 를 때리게 된다.
    ports:
      - "21080:3000"   # HTTP API (디버깅용 — 외부 공개 금지, nginx 경유가 정식 경로)

    # ───── 볼륨 마운트 ─────
    # 로그를 호스트에 보관하여 컨테이너 삭제 시에도 보존
    volumes:
      - /volume1/docker/ecadminapi/logs:/app/logs

    # ───── 재시작 정책 ─────
    # unless-stopped: NAS 재부팅 시 자동 시작 (수동 정지한 경우 제외)
    restart: unless-stopped

    # ───── Health Check ─────
    # Dockerfile에 정의된 것을 오버라이드 가능. spring-boot-starter-actuator 는 이미 의존성에
    # 있고 application-prod.yml 이 health,info 를 노출하므로 SPRING_PROFILES_ACTIVE=prod(또는
    # dev) 로 띄우면 정상 응답한다 — local 프로파일은 actuator 를 의도적으로 전부 꺼두므로
    # (application-local.yml) 로컬 테스트 시엔 이 헬스체크가 항상 실패로 보이는 게 정상이다.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

    # ───── 로그 드라이버 (디스크 보호) ─────
    logging:
      driver: "json-file"
      options:
        max-size: "10m"   # 단일 로그 파일 최대 크기
        max-file: "5"     # 보관할 로그 파일 개수

  # ═══════════════════════════════════════════════════════════
  #  Nginx — 정적 자산(FO/BO) 서빙 + 압축(gzip) + 캐시 헤더 + API 리버스 프록시
  #  2026-08-30 신설. 지금까지 정적 파일을 실제로 서빙하는 계층이 없었다(ecadminapi 컨테이너엔
  #  프론트 파일 자체가 안 들어있음 — Dockerfile 이 JAR만 담음). 이 서비스가 그 역할을 한다.
  #  설정 본문은 ../../EcAdminApi/nginx.conf(경로 예시 — 실제로는 이 compose 파일과 같은 디렉터리에
  #  nginx.conf 사본을 두거나 심볼릭 링크할 것) 참조.
  # ═══════════════════════════════════════════════════════════
  nginx:
    image: nginx:1.27-alpine
    container_name: 220-shopjoy-nginx

    depends_on:
      - ecadminapi

    # ───── 포트 매핑 ─────
    # 실제 공개 진입점. 방화벽/공유기 포트포워딩은 이 포트로 연결할 것(21080 아님).
    ports:
      - "21000:80"

    # ───── 볼륨 마운트 ─────
    # nginx.conf/locations.conf/security-headers.conf: 이 리포의 _apps_be/EcAdminApi/ 안 파일을
    #   그대로 사용(3개 다 같은 디렉터리에 있어야 nginx.conf 의 include 상대참조가 맞음).
    # frontend: FO/BO 빌드 산출물 루트(dist/, npm run build 로 생성 — bo.html/index.html 이
    #   있는 폴더) — rsync -avz --delete dist/ NAS:.../frontend/ 로 배포할 때마다 채워진다.
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./locations.conf:/etc/nginx/locations.conf:ro
      - ./security-headers.conf:/etc/nginx/security-headers.conf:ro
      - /volume1/docker/shopjoy/frontend:/usr/share/nginx/html:ro
      # HTTPS 활성화 시(nginx.conf [443 블록] 주석 해제와 함께) 아래 볼륨도 추가할 것 —
      # certbot 이 발급한 인증서를 컨테이너 안 /etc/letsencrypt 경로로 읽기 전용 마운트.
      # - /volume1/docker/shopjoy/certs:/etc/letsencrypt:ro

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

# ───── 네트워크 (선택) ─────
networks:
  default:
    name: shopjoy-net
