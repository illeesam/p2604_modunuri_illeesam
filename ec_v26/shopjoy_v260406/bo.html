    /* ═══════════════════════════════════════════════════════════════════
       사이트 기본값 설정 (변경 시 이 한 줄만 수정)
       ═══════════════════════════════════════════════════════════════════ */
    const DEFAULT_BO_SITE_NO = '01';
    /* BO_SITE_NO — URL ?SITE_NO=02 로 오버라이드 가능, localStorage 영속 */
    (function(){
      var _toSiteId = function(no){ return '260401' + String(no || '01').padStart(10, '0'); };
      try {
        var qs = new URLSearchParams(window.location.search);
        var v = qs.get('SITE_NO');
        if (v) {
          window.BO_SITE_NO = v;
          try {
            qs.delete('SITE_NO');
            var newSearch = qs.toString();
            history.replaceState(null, '', window.location.pathname + (newSearch ? '?' + newSearch : '') + window.location.hash);
          } catch(_){}
        } else {
          var saved = null;
          try { saved = localStorage.getItem('modu-bo-sy-siteNo'); } catch(_){}
          window.BO_SITE_NO = saved || DEFAULT_BO_SITE_NO;
        }
        /* 카멜 키로 항상 영속화 (로그인/접속만 해도 modu-bo-sy-siteNo / modu-bo-sy-siteId 생성) */
        try {
          localStorage.setItem('modu-bo-sy-siteNo', window.BO_SITE_NO);
          localStorage.setItem('modu-bo-sy-siteId', _toSiteId(window.BO_SITE_NO));
        } catch(_){}
      } catch(e) { window.BO_SITE_NO = DEFAULT_BO_SITE_NO; }
      /* BO_SITE_NO 기준 CSS 로드 */
      document.write('<link rel="stylesheet" href="assets/css/bo-global-style' + window.BO_SITE_NO + '.css">');
    })();
    /* 다른 탭에서 SITE_NO 변경 시 자동 반영.
     * ⚠️ 무한 리로드 방지: 실제로 "다른 값"으로 바뀌었고, 현재 탭의 BO_SITE_NO 와도 다를 때만 reload.
     *   (이전 코드는 newValue!==oldValue 만 보고 reload → 같은 값 재기록/탭 핑퐁 시 무한 루프 발생) */
    window.addEventListener('storage', function(e){
      try {
        if (e.key !== 'modu-bo-sy-siteNo') return;
        var nv = e.newValue;
        if (!nv) return;                                  // 삭제 이벤트(null)는 무시
        if (nv === e.oldValue) return;                    // 값 변화 없으면 무시
        if (nv === window.BO_SITE_NO) return;             // 현재 탭과 같은 값이면 reload 불필요 (핑퐁 차단)
        location.reload();
      } catch(_){}
    });
    /* 기본 페이지 자동 이동 — 쿼리에 page 없이 진입 시 대시보드(홈)로
       (2026-08-22 해시(#page=)에서 쿼리스트링(?page=)으로 전환 — 주소창에 # 안 보이게) */
    (function(){
      try {
        var qs = new URLSearchParams(window.location.search);
        if (!qs.get('page')) {
          qs.set('page', 'dashboard');
          history.replaceState(null, '', window.location.pathname + '?' + qs.toString());
        }
      } catch(_){}
    })();
  </script>
