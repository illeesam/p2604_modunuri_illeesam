<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>코바늘 도안 제작</title>

  <!-- ═══════════════════════════════════════════════════════════════════════════
       독립 FO 모듈 표준 부트스트랩 — index.html 의 B2~B3 스크립트 블록과 동일 순서.
       "앞으로 추가될 모듈들도 이런 패턴" (2026-08-23) — 새 모듈은 이 파일을 복사한 뒤
       B99 섹션의 콘텐츠 컴포넌트(window.MdCbCobanulPage)만 자기 pages/md/{모듈}/*.js 로 바꾸면 된다.
  ═══════════════════════════════════════════════════════════════════════════ -->

  <!-- ■ H1.1: CDN Core Runtime ■ -->
  <script src="assets/cdn/pkg/vue/3.4.21/vue.global.prod.js"></script>
  <script src="assets/cdn/pkg/vue-demi/0.14.10/vue-demi.iife.js"></script>
  <script src="assets/cdn/pkg/pinia/2.1.7/pinia.iife.js"></script>

  <!-- ■ H1.2: CDN Libraries ■ -->
  <script src="assets/cdn/pkg/axios/1.7.9/axios.min.js"></script>

  <!-- ■ H1.2a: Social Login / Payment / Map SDK (외부 CDN, 키는 로그인 후 server init data 로 주입) ■
       index.html 과 동일 목록 — 상단 헤더의 카카오공유/소셜로그인이 이 스크립트들에 의존한다. -->
  <!-- Google Identity Services (GIS) — One Tap / OAuth2 popup -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Kakao JavaScript SDK -->
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js"
          integrity="sha384-TiCUE00h649CAMonG018J2ujOgDKW/kVWlChEuu4jK2vxfAAD0eZxzCKakxg55G4"
          crossorigin="anonymous"></script>
  <!-- Naver Login SDK (구버전 jQuery 의존 없음) -->
  <script src="https://static.nid.naver.com/js/naveridlogin_js_sdk_2.0.2.js" charset="utf-8"></script>
  <!-- Toss Payments SDK v2 -->
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <!-- Naver Map / Kakao Map: 키가 필요해 로그인 후 동적 로드 → coExtSdk.js 가 동적 <script> 주입 -->

  <!-- ■ H1.3: Fonts & CSS ■ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap">
  <script>window.FO_SITE_NO = window.FO_SITE_NO || '01';</script>
  <link rel="stylesheet" href="assets/css/fo-global-style01.css">
  <!-- 모듈 공통 스타일 — 반드시 fo-global-style 다음(버튼 톤을 모듈용으로 덮어씀) -->
  <link rel="stylesheet" href="assets/css/fo-md-module-style.css">
  <!-- 코바늘 도안 제작 화면 전용 스타일 — 인라인이던 것을 분리(2026-08-25) -->
  <link rel="stylesheet" href="assets/css/fo-md-cb-cobanul-style.css">
</head>
<body>
  <div id="_boot_loading" role="status" aria-busy="true">
    <div class="spin" aria-hidden="true"></div>
    <div class="txt">로딩 중…</div>
  </div>
  <div id="app"></div>

  <!-- ■ B2.1: Axios & Utility Wrappers ■ -->
  <script src="lib/license/licenseFo.js"></script>
  <script src="lib/utils/coUtil.js"></script>
  <!-- jsPDF + html2canvas: 화면 영역을 그대로 캡처해 PDF 로 내려받는 기능용(coUtil.cofExportPdf, 헤더 PDF 아이콘) -->
  <script src="assets/cdn/pkg/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="assets/cdn/pkg/jspdf/2.5.2/jspdf.umd.min.js"></script>
  <script src="lib/utils/foApiAxios.js"></script>
  <script src="lib/utils/foUtil.js"></script>
  <script src="lib/env/foEnvConsts.js"></script>
  <script src="lib/utils/coExtSdk.js"></script>
  <script src="lib/utils/coAuth.js"></script>

  <!-- ■ B2.2: 공통 API 서비스 ■ -->
  <script src="lib/services/coApiSvc.js"></script>
  <script src="lib/services/mdCbApiSvc.js"></script>

  <!-- ■ B2.3: Config ■ -->
  <script src="lib/app/foAppConfig.js"></script>

  <!-- ■ B3.1: Pinia Stores ■ -->
  <script src="lib/stores/fo/foAppInitStore.js"></script>
  <script src="lib/stores/fo/foAppStore.js"></script>
  <script src="lib/stores/fo/foAuthStore.js"></script>
  <script src="lib/stores/fo/foCodeStore.js"></script>

  <!-- ■ B3.2: Auth orchestrator (foAuthStore 의존) ■ -->
  <script src="lib/app/foAppAuth.js"></script>

  <!-- ■ B3.2: Layout Components (ShopJoy 공통 헤더/사이드바/푸터) ■ -->
  <script src="components/layout/foAppFooter.js"></script>
  <script src="components/layout/foAppHeader.js"></script>
  <script src="components/layout/foAppSidebar.js"></script>

  <!-- ■ B3.3: Base Components & 로그인 모달 ■ -->
  <script src="components/comp/BaseComp.js"></script>
  <script src="components/comp/FoComp.js"></script>
  <script src="components/comp/FoAreaComp.js"></script>
  <script src="components/comp/CoWidgetComp.js"></script>
  <!-- Login.js 의 "회원선택"(개발용) 서브모달이 bo-multi-check-select 를 씀(FO/BO 공용 위젯) -->
  <script src="components/comp/BoComp.js"></script>
  <script src="pages/fo/Login.js"></script>

  <!-- ■ B3.4: 독립 모듈 공용 셸 (theme/auth/사이드바/토스트 — index.html 의 foAppBase.js 축약판) ■ -->
  <script src="lib/app/foModuleShell.js"></script>

  <!-- ■ B4.1: 이 모듈의 콘텐츠 컴포넌트 (pages/md/{모듈}/) — 목록/상세 분리(2026-08-23) ■ -->
  <script src="pages/md/cb/MdCbPatternListPage.js"></script>
  <script src="pages/md/cb/MdCbCobanulPage.js"></script>

  <!-- ■ B99: 메인 앱 부트스트랩 (반드시 마지막) ■ -->
  <script>
    (function () {
      const { createApp, computed } = Vue;

      const pinia = Pinia.createPinia();
      window.foAuth.init(pinia);

      const ModuleRoot = {
        name: 'CbCobanulModuleRoot',
        setup() {
          const shell = window.foModuleShell.create();
          /* 이 모듈은 index.html 라우팅 밖이라 page 값이 고정 — 헤더/사이드바가 현재 메뉴를
             하이라이트할 근거로만 쓰고, 실제 화면 전환에는 관여하지 않는다. */
          const page = computed(() => 'cobanul');
          /* 목록/상세 2뷰 — 쿼리스트링 기준(해시 라우터 없이 전체 새로고침으로 전환).
             view=editor 이거나 patternId 가 있으면 상세(편집), 그 외엔 목록. */
          const qs = new URLSearchParams(location.search);
          const curView = (qs.get('view') === 'editor' || qs.get('patternId')) ? 'editor' : 'list';
          return { ...shell, page, curView };
        },
        template: /* html */`
<div style="min-height:100vh;display:flex;flex-direction:column;">
  <fo-app-header
    :page="page" :theme="theme" :app-sidebar-open="sidebarOpen" :app-mobile-open="uiState.mobileOpen"
    :config="config" :navigate="navigate" :toggle-theme="toggleTheme" :app-cart-count="cfCartCount" :app-like-count="cfLikeCount"
    :app-auth="auth" :on-app-show-login="onShowLogin" :on-app-logout="onLogout"
    :app-show-settings="showSettings" :app-show-api-log="showApiLog"
    :app-api-logs="foApiLogs" :app-api-toast="apiToastEnabled"
    @modu-fo-toggle-sidebar="sidebarOpen=!sidebarOpen" @modu-fo-toggle-mobile="toggleMobileMenu"
    @modu-fo-toggle-settings="showSettings=!showSettings"
    @modu-fo-toggle-api-log="onToggleApiLog"
    @modu-fo-toggle-api-toast="onToggleApiToast"
  />
  <div style="flex:1;display:flex;overflow:hidden;position:relative;">
    <fo-app-sidebar
      v-show="cfShowSidebar || uiState.mobileOpen"
      :page="page" :app-sidebar-open="sidebarOpen" :app-mobile-open="uiState.mobileOpen"
      :config="config" :navigate="navigate" :app-cart-count="cfCartCount" :app-auth="auth"
      @modu-fo-toggle-sidebar="sidebarOpen=!sidebarOpen" @modu-fo-close-mobile="closeMobileMenu"
    />
    <div class="sidebar-overlay" :class="{show: uiState.mobileOpen}" @click="closeMobileMenu"></div>
    <main class="layout-main" style="flex:1;overflow-y:auto;min-width:0;">
      <md-cb-pattern-list-page v-if="curView==='list'" :show-toast="showToast" :show-confirm="showConfirm" />
      <md-cb-cobanul-page v-else :show-toast="showToast" :show-confirm="showConfirm" />
      <fo-app-footer :config="config" :navigate="navigate" />
    </main>
  </div>

  <login v-if="uiState.showLogin" :show-toast="showToast" @close="uiState.showLogin=false" />

  <div v-if="toasts.length" class="cb-toast-stack">
    <div v-for="t in toasts" :key="t.id" class="cb-toast" :class="t.type">{{ t.msg }}</div>
  </div>

  <!-- CONFIRM MODAL — index.html(foAppBase.js)과 동일한 디자인 컨펌(window.confirm() 대체) -->
  <div v-if="confirmState.show" class="modal-overlay" style="z-index:10000;" @click.self="closeConfirm(false)">
    <div class="modal-box">
      <div class="modal-icon icon-warning">⚠️</div>
      <div class="modal-title">{{ confirmState.title }}</div>
      <div class="modal-msg">{{ confirmState.msg }}</div>
      <div class="modal-actions" style="gap:10px;">
        <button class="btn-outline" @click="closeConfirm(false)" style="padding:10px 20px;">취소</button>
        <button class="btn-blue" @click="closeConfirm(true)" style="padding:10px 20px;">확인</button>
      </div>
    </div>
  </div>
</div>
`,
      };

      const app = createApp(ModuleRoot);
      app.use(pinia);
      /* foAppComp.js 의 foRegisterComponents(app) 는 체이닝 도중 하나라도 window.X 가
         undefined 면 (Vue app.component(name, falsy) 가 getter 로 오동작해 this 대신 undefined 를
         반환) 체인이 끊겨 크래시한다 — index.html 은 모든 페이지 컴포넌트를 다 로드해서 문제가 없었을 뿐.
         이 모듈은 일부만 로드하므로 체이닝 없이 개별 호출로 등록한다(하나가 undefined 여도 다음 줄에
         영향 없음). */
      app.component('FoAppHeader', window.foAppHeader);
      app.component('FoAppSidebar', window.foAppSidebar);
      app.component('FoAppFooter', window.foAppFooter);
      app.component('Login', window.Login);
      app.component('FoPage', window.FoPage);
      app.component('FoContainer', window.FoContainer);
      app.component('FoSearchArea', window.FoSearchArea);
      app.component('FoFormArea', window.FoFormArea);
      app.component('FoGrid', window.FoGrid);
      app.component('FoGridCrud', window.FoGridCrud);
      app.component('FoModal', window.FoModal);
      app.component('FoRowCancelDelete', window.FoRowCancelDelete);
      app.component('FoPager', window.FoPager);
      app.component('FoTabBar', window.FoTabBar);
      app.component('BaseAttachGrp', window.BaseAttachGrp);
      app.component('BaseHtmlEditor', window.BaseHtmlEditor);
      app.component('BaseTossPayWidget', window.BaseTossPayWidget);
      app.component('CoBarcodeWidget', window.CoBarcodeWidget);
      app.component('CoCountdownWidget', window.CoCountdownWidget);
      app.component('BoMultiCheckSelect', window.BoMultiCheckSelect);
      app.component('MdCbPatternListPage', window.MdCbPatternListPage);
      app.component('MdCbCobanulPage', window.MdCbCobanulPage);
      app.mount('#app');

      const loadingEl = document.getElementById('_boot_loading');
      if (loadingEl) {
        loadingEl.classList.add('done');
        setTimeout(() => { if (loadingEl.parentNode) loadingEl.parentNode.removeChild(loadingEl); }, 350);
      }
    })();
  </script>
</body>
</html>
